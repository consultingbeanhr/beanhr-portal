<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeanHR — Payslips & Salary</title>
    <script>(function(){var t=localStorage.getItem('bhr_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent:       #77ca00;
            --accent-light: #a0e040;
            --accent-glow:  rgba(119,202,0,0.35);
            --brown:        #a86a3e;
            --brown-light:  #c8854a;
            --brown-glow:   rgba(168,106,62,0.25);
            --bg:           #07070f;
            --text:         #f1f1f5;
            --text-muted:   rgba(241,241,245,0.55);
            --text-faint:   rgba(241,241,245,0.2);
            --icon-faint:   rgba(241,241,245,0.3);
            --icon-muted:   rgba(241,241,245,0.65);
            --glass-bg:     rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.08);
            --sidebar-w:    240px;
            --topbar-h:     64px;
            --success:      #4ade80;
            --success-bg:   rgba(74,222,128,0.12);
            --warning:      #fbbf24;
            --danger:       #f87171;
            --danger-bg:    rgba(248,113,113,0.12);
            --blue:         #60a5fa;
            --blue-bg:      rgba(96,165,250,0.12);
        }

        /* ── Light Theme ──────────────────────────────────────────── */
        [data-theme="light"] {
            --bg:           #f0f6e8;
            --accent:       #5a9900;
            --accent-light: #77ca00;
            --accent-glow:  rgba(90,153,0,0.2);
            --text:         #1a2010;
            --text-muted:   rgba(26,32,16,0.58);
            --text-faint:   rgba(26,32,16,0.35);
            --icon-faint:   rgba(26,32,16,0.32);
            --icon-muted:   rgba(26,32,16,0.65);
            --glass-bg:     rgba(255,255,255,0.82);
            --glass-border: rgba(26,32,16,0.1);
            --success-bg:   rgba(50,140,70,0.1);
            --danger-bg:    rgba(200,50,50,0.08);
            --blue-bg:      rgba(50,100,200,0.08);
        }
        [data-theme="light"] .bg {
            background:
                radial-gradient(ellipse at 15% 55%, rgba(90,153,0,0.1) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 15%, rgba(168,106,62,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 65% 85%, rgba(90,153,0,0.07) 0%, transparent 50%),
                #f0f6e8;
        }
        [data-theme="light"] .orb   { opacity: 0.18; }
        [data-theme="light"] .orb-1 { background: radial-gradient(circle, rgba(90,153,0,0.2), transparent 70%); }
        [data-theme="light"] .orb-2 { background: radial-gradient(circle, rgba(168,106,62,0.1), transparent 70%); }
        [data-theme="light"] .sidebar  { background: rgba(255,255,255,0.88); }
        [data-theme="light"] .topbar   { background: rgba(240,246,232,0.94); border-bottom-color: rgba(0,0,0,0.07); }
        [data-theme="light"] .card     { box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.05) inset; }
        [data-theme="light"] .notif-item { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.08); }
        [data-theme="light"] .notif-item.unread { background: rgba(90,153,0,0.07); border-color: rgba(90,153,0,0.2); }
        [data-theme="light"] .nav-item:hover { background: rgba(0,0,0,0.04); }
        [data-theme="light"] .notif-btn,
        [data-theme="light"] .sidebar-toggle { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.1); }
        [data-theme="light"] .mark-read-link { color: #4a7000; }
        [data-theme="light"] .notif-dropdown { background: #ffffff; box-shadow: 0 8px 32px rgba(0,0,0,0.15); border-color: rgba(0,0,0,0.1); }
        [data-theme="light"] .notif-dismiss:hover { background: rgba(248,113,113,0.1); }
        [data-theme="light"] .salary-card        { background: linear-gradient(135deg, rgba(90,153,0,0.12) 0%, rgba(119,202,0,0.06) 100%); border-color: rgba(90,153,0,0.2); }
        [data-theme="light"] .breakdown-item     { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.08); }
        [data-theme="light"] .payslip-row:hover  { background: rgba(0,0,0,0.025); }
        [data-theme="light"] .payslip-row + .payslip-row { border-top-color: rgba(0,0,0,0.07); }
        [data-theme="light"] .advance-row:hover  { background: rgba(0,0,0,0.025); }
        [data-theme="light"] .advance-row + .advance-row { border-top-color: rgba(0,0,0,0.07); }
        [data-theme="light"] .form-input  { background-color: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.12); color: var(--text); }
        [data-theme="light"] .form-input:focus { border-color: rgba(90,153,0,0.5); background-color: rgba(255,255,255,0.9); }
        [data-theme="light"] .form-textarea { background-color: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.12); color: var(--text); }
        [data-theme="light"] .form-textarea:focus { border-color: rgba(90,153,0,0.5); background-color: rgba(255,255,255,0.9); }

        html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

        /* ── Animated Background ──────────────────────────────────── */
        .bg { position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse at 15% 55%, rgba(119,202,0,0.13) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 15%, rgba(160,224,64,0.09) 0%, transparent 50%),
                radial-gradient(ellipse at 65% 85%, rgba(99,179,255,0.06) 0%, transparent 50%),
                var(--bg);
        }
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.4; animation: drift linear infinite; }
        .orb-1 { width:550px; height:550px; background:radial-gradient(circle, rgba(119,202,0,0.2), transparent 70%); top:-180px; left:-120px; animation-duration:22s; }
        .orb-2 { width:420px; height:420px; background:radial-gradient(circle, rgba(160,224,64,0.14), transparent 70%); bottom:-110px; right:-90px; animation-duration:28s; animation-direction:reverse; }
        .orb-3 { width:320px; height:320px; background:radial-gradient(circle, rgba(99,179,255,0.1), transparent 70%); top:38%; right:18%; animation-duration:34s; }
        @keyframes drift { 0%{transform:translate(0,0) scale(1)} 33%{transform:translate(28px,-28px) scale(1.06)} 66%{transform:translate(-18px,18px) scale(0.95)} 100%{transform:translate(0,0) scale(1)} }

        /* ── App Shell ────────────────────────────────────────────── */
        .app-shell { position: relative; display: flex; height: 100vh; overflow: hidden; }

        /* ── Sidebar ──────────────────────────────────────────────── */
        .sidebar {
            width: var(--sidebar-w);
            height: 100vh;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.025);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            padding: 24px 14px;
            overflow: hidden;
            overflow-y: auto;
            transition: width 0.28s cubic-bezier(0.22,1,0.36,1);
        }
        .sidebar.collapsed { width: 64px; }
        .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 0 4px 22px; border-bottom: 1px solid var(--glass-border); margin-bottom: 14px; white-space: nowrap; }
        .brand-toggle { width: 36px; height: 36px; min-width: 36px; flex-shrink: 0; background: linear-gradient(135deg, var(--accent), var(--accent-light)); border-radius: 10px; border: none; cursor: pointer; position: relative; box-shadow: 0 4px 16px var(--accent-glow); transition: box-shadow 0.2s; padding: 0; }
        .brand-toggle:hover { box-shadow: 0 4px 24px var(--accent-glow), 0 0 0 2px rgba(119,202,0,0.4); }
        .brand-logo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: #fff; opacity: 1; transform: rotate(0deg); transition: opacity 0.25s, transform 0.42s cubic-bezier(0.22,1,0.36,1); pointer-events: none; }
        .brand-hamburger { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; opacity: 0; transform: rotate(-90deg); transition: opacity 0.25s, transform 0.42s cubic-bezier(0.22,1,0.36,1); pointer-events: none; }
        .brand-hamburger span { display: block; width: 14px; height: 1.5px; background: #fff; border-radius: 2px; }
        .sidebar.collapsed .brand-logo      { opacity: 0; transform: rotate(90deg); }
        .sidebar.collapsed .brand-hamburger { opacity: 1; transform: rotate(0deg); }
        .sidebar-brand-text { overflow: hidden; max-width: 160px; transition: opacity 0.22s, max-width 0.28s cubic-bezier(0.22,1,0.36,1); }
        .sidebar-brand-name { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; white-space: nowrap; }
        .sidebar-brand-tag  { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 1px; }
        .sidebar.collapsed .sidebar-brand-text { opacity: 0; max-width: 0; }

        .sidebar-section-label { font-size: 10px; font-weight: 600; color: var(--brown); text-transform: uppercase; letter-spacing: 1.5px; padding: 0 10px; margin: 8px 0 6px; display: block; white-space: nowrap; overflow: hidden; max-height: 30px; transition: opacity 0.2s, max-height 0.28s, margin 0.28s; }
        .sidebar.collapsed .sidebar-section-label { opacity: 0; max-height: 0; margin: 0; }

        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 9px; border-radius: 10px; font-size: 13.5px; font-weight: 500; color: var(--text-muted); text-decoration: none; transition: background 0.15s, color 0.15s; margin-bottom: 2px; position: relative; white-space: nowrap; overflow: hidden; }
        .nav-item:hover  { background: rgba(255,255,255,0.05); color: var(--text); }
        .nav-item.active { background: rgba(119,202,0,0.14); color: var(--accent-light); }
        .nav-item.active .nav-icon { color: var(--accent-light); }
        .nav-icon { width: 20px; height: 20px; min-width: 20px; font-size: 20px; flex-shrink: 0; color: var(--icon-faint); transition: color 0.15s; display: flex; align-items: center; justify-content: center; }
        .nav-item:hover .nav-icon { color: var(--icon-muted); }
        .ph-icon-fill    { display: block; }
        .ph-icon-outline { display: none; }
        [data-theme="light"] .ph-icon-fill    { display: none; }
        [data-theme="light"] .ph-icon-outline { display: block; }
        .nav-label { overflow: hidden; max-width: 160px; white-space: nowrap; transition: opacity 0.2s, max-width 0.28s cubic-bezier(0.22,1,0.36,1); }
        .sidebar.collapsed .nav-label  { opacity: 0; max-width: 0; }
        .sidebar.collapsed .nav-item   { justify-content: center; padding: 10px 0; gap: 0; }
        .sidebar.collapsed .logout-btn { justify-content: center; padding: 10px 0; gap: 0; }
        .sidebar.collapsed .sidebar-brand { padding-left: 0; gap: 0; }

        .nav-item[data-tip] { position: relative; }
        .sidebar.collapsed .nav-item[data-tip]:hover::after {
            content: attr(data-tip);
            position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%);
            background: rgba(22,22,38,0.96); border: 1px solid var(--glass-border);
            border-radius: 8px; padding: 5px 10px; font-size: 12.5px; font-weight: 500;
            color: var(--text); white-space: nowrap; pointer-events: none; z-index: 200;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }

        .sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--glass-border); overflow: hidden; }
        .logout-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 9px; background: none; border: none; border-radius: 10px; font-size: 13.5px; font-weight: 500; color: rgba(248,113,113,0.65); cursor: pointer; transition: background 0.15s, color 0.15s; white-space: nowrap; overflow: hidden; }
        .logout-btn:hover { background: rgba(248,113,113,0.09); color: var(--danger); }
        .logout-label { overflow: hidden; max-width: 160px; white-space: nowrap; transition: opacity 0.2s, max-width 0.28s cubic-bezier(0.22,1,0.36,1); }
        .sidebar.collapsed .logout-label { opacity: 0; max-width: 0; }

        /* ── Main Area ────────────────────────────────────────────── */
        .main-area { flex: 1; overflow-y: auto; height: 100vh; display: flex; flex-direction: column; min-width: 0; scrollbar-width: none; -ms-overflow-style: none; }
        .main-area::-webkit-scrollbar { display: none; }

        /* ── Topbar ───────────────────────────────────────────────── */
        .topbar {
            height: var(--topbar-h);
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px;
            background: rgba(7,7,15,0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 10;
        }
        .topbar-left  { display: flex; align-items: center; gap: 14px; }
        .topbar-greeting { font-size: 16px; font-weight: 600; line-height: 1.3; }
        .topbar-date     { font-size: 12px; color: var(--text-muted); }
        .topbar-right    { display: flex; align-items: center; gap: 12px; }

        .notif-btn { position: relative; width: 38px; height: 38px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); transition: background 0.15s, color 0.15s; overflow: visible; }
        .notif-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
        .notif-badge { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; background: var(--accent); border-radius: 8px; font-size: 10px; font-weight: 700; color: #fff; display: flex; align-items: center; justify-content: center; padding: 0 4px; border: 2px solid var(--bg); }
        .avatar { width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent), var(--accent-light)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; cursor: pointer; box-shadow: 0 2px 12px var(--accent-glow); flex-shrink: 0; transition: transform 0.15s; }
        .avatar:hover { transform: scale(1.08); }

        /* ── Page Content ─────────────────────────────────────────── */
        .page-content { padding: 24px; flex: 1; }

        /* ── Page Header ──────────────────────────────────────────── */
        .page-header   { margin-bottom: 22px; }
        .page-title    { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 3px; }
        .page-subtitle { font-size: 13px; color: var(--text-muted); }

        /* ── Glass Card ───────────────────────────────────────────── */
        .card { background: var(--glass-bg); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border: 1px solid var(--glass-border); border-radius: 18px; padding: 22px; box-shadow: 0 8px 32px rgba(0,0,0,0.28), 0 0 0 1px rgba(255,255,255,0.02) inset; margin-bottom: 16px; }
        .card:last-child { margin-bottom: 0; }

        /* ── Card Header ──────────────────────────────────────────── */
        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .card-header-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .card-header-icon.green  { background: var(--success-bg); color: var(--success); }
        .card-header-icon.blue   { background: var(--blue-bg);    color: var(--blue);    }
        .card-header-icon.yellow { background: rgba(251,191,36,0.12); color: #fbbf24; }
        .card-header-text .card-title { font-size: 15px; font-weight: 600; }
        .card-header-text .card-desc  { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

        /* ── Last Salary Summary Card ─────────────────────────────── */
        .salary-card {
            background: linear-gradient(135deg, rgba(119,202,0,0.1) 0%, rgba(119,202,0,0.04) 100%);
            border-color: rgba(119,202,0,0.18);
            padding: 24px 28px;
        }
        .salary-top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 22px; }
        .salary-label-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .salary-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .salary-month { font-size: 12px; color: var(--text-faint); padding: 2px 9px; background: rgba(255,255,255,0.06); border-radius: 20px; }
        .salary-amount { font-size: 38px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; color: var(--text); }
        .salary-amount span { font-size: 22px; font-weight: 600; color: var(--text-muted); vertical-align: top; margin-top: 4px; display: inline-block; }
        .salary-status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .salary-status-badge.issued  { background: var(--success-bg); color: var(--success); border: 1px solid rgba(74,222,128,0.25); }
        .salary-status-badge.draft   { background: rgba(251,191,36,0.12); color: #fbbf24; border: 1px solid rgba(251,191,36,0.25); }

        .salary-breakdown { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .breakdown-item { background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px 14px; }
        .breakdown-label { font-size: 11px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 5px; }
        .breakdown-value { font-size: 16px; font-weight: 700; }
        .breakdown-value.base       { color: var(--text); }
        .breakdown-value.bonus      { color: var(--success); }
        .breakdown-value.deductions { color: var(--danger); }

        /* ── Page Layout ──────────────────────────────────────────── */
        .payslips-layout { display: grid; grid-template-columns: 1fr 360px; gap: 16px; align-items: start; }
        .payslips-left-card { display: flex; flex-direction: column; }
        .payslips-left-card > .card { display: flex; flex-direction: column; }
        .payslip-list { max-height: 620px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; -ms-overflow-style: none; }
        .payslip-list::-webkit-scrollbar { display: none; }

        /* ── Payslips List Card ───────────────────────────────────── */
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .section-title  { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .section-count  { padding: 2px 9px; background: rgba(255,255,255,0.06); border-radius: 20px; font-size: 11.5px; font-weight: 600; color: var(--text-muted); }

        .payslip-card-header { margin: -22px -22px 0 -22px; padding: 16px 22px 14px; border-bottom: 1px solid var(--glass-border); background: rgba(255,255,255,0.025); border-radius: 18px 18px 0 0; margin-bottom: 0 !important; }
        .payslip-card-header .section-title { font-size: 16.5px; }

        .payslip-row {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 8px;
            border-radius: 10px;
            transition: background 0.12s;
            margin: 0 -8px;
        }
        .payslip-row:hover { background: rgba(255,255,255,0.025); }
        .payslip-row + .payslip-row { border-top: 1px solid var(--glass-border); margin-top: 0; }

        .payslip-header-icon { width: 34px; height: 34px; background: var(--blue-bg); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: var(--blue); flex-shrink: 0; }
        .payslip-main { flex: 1; min-width: 0; }
        .payslip-month { font-size: 14px; font-weight: 600; }
        .payslip-net   { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
        .payslip-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        .download-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 14px; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.2);
            border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--blue);
            cursor: pointer; transition: background 0.15s, border-color 0.15s; white-space: nowrap;
        }
        .download-btn:hover { background: rgba(96,165,250,0.18); border-color: rgba(96,165,250,0.35); }

        /* Status badge (reused) */
        .status-badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
        .status-badge.issued     { background: var(--success-bg); color: var(--success); border: 1px solid rgba(74,222,128,0.25); }
        .status-badge.draft      { background: rgba(251,191,36,0.12); color: #fbbf24; border: 1px solid rgba(251,191,36,0.25); }
        .status-badge.approved   { background: var(--success-bg); color: var(--success); border: 1px solid rgba(74,222,128,0.25); }
        .status-badge.rejected   { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(248,113,113,0.25); }

        /* ── Salary Advance Card ──────────────────────────────────── */
        .advance-form { display: flex; flex-direction: column; gap: 14px; }
        .upload-field { display: flex; flex-direction: column; gap: 5px; }
        .field-label  { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }

        .form-input {
            width: 100%; padding: 10px 13px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            border-radius: 10px; font-size: 13.5px; font-weight: 500; color: var(--text);
            font-family: 'Inter', sans-serif; outline: none;
            transition: border-color 0.15s, background 0.15s;
        }
        .form-input::placeholder  { color: var(--text-faint); }
        .form-input:focus         { border-color: rgba(119,202,0,0.45); background-color: rgba(255,255,255,0.07); }

        .form-textarea {
            width: 100%; padding: 10px 13px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            border-radius: 10px; font-size: 13px; color: var(--text);
            font-family: 'Inter', sans-serif; outline: none; resize: vertical; min-height: 80px;
            transition: border-color 0.15s, background 0.15s;
        }
        .form-textarea::placeholder { color: var(--text-faint); }
        .form-textarea:focus        { border-color: rgba(119,202,0,0.45); background-color: rgba(255,255,255,0.07); }

        .submit-btn {
            width: 100%; padding: 12px 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border: none; border-radius: 12px; font-size: 13.5px; font-weight: 700; color: #fff;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 18px var(--accent-glow); transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
        }
        .submit-btn:hover:not(:disabled) { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 6px 24px var(--accent-glow); }
        .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Advance History Table ────────────────────────────────── */
        .advance-row {
            display: flex; align-items: flex-start; gap: 14px;
            padding: 14px 8px;
            border-radius: 10px;
            transition: background 0.12s;
            margin: 0 -8px;
        }
        .advance-row:hover { background: rgba(255,255,255,0.025); }
        .advance-row + .advance-row { border-top: 1px solid var(--glass-border); }

        .advance-icon { width: 38px; height: 38px; background: rgba(251,191,36,0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 19px; color: #fbbf24; flex-shrink: 0; margin-top: 1px; }
        .advance-main { flex: 1; min-width: 0; }
        .advance-amount  { font-size: 14px; font-weight: 700; }
        .advance-reason  { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .advance-date    { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; }
        .advance-comment { font-size: 12px; color: var(--danger); margin-top: 4px; font-style: italic; }
        .advance-right   { flex-shrink: 0; padding-top: 2px; }

        /* Advance history scrollable list */
        .advance-list { max-height: 320px; overflow-x: hidden; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
        .advance-list::-webkit-scrollbar { display: none; }

        /* ── Empty State ──────────────────────────────────────────── */
        .empty-state { text-align: center; padding: 42px 0; }
        .empty-icon { width: 52px; height: 52px; background: rgba(255,255,255,0.04); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--text-faint); margin: 0 auto 12px; }
        .empty-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .empty-msg   { font-size: 12.5px; color: var(--text-muted); }

        /* ── Notification Dropdown ────────────────────────────────── */
        .notif-dropdown { position: absolute; top: calc(100% + 10px); right: 0; width: 340px; max-height: 440px; background: #16161f; backdrop-filter: none; -webkit-backdrop-filter: none; border: 1px solid var(--glass-border); border-radius: 18px; box-shadow: 0 16px 48px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04) inset; z-index: 200; display: flex; flex-direction: column; opacity: 0; transform: translateY(-6px) scale(0.97); pointer-events: none; transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.22,1,0.36,1); }
        .notif-dropdown.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
        .notif-dropdown-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; border-bottom: 1px solid var(--glass-border); flex-shrink: 0; }
        .notif-dropdown-title { font-size: 14px; font-weight: 600; }
        .mark-read-link { font-size: 12px; color: rgba(119,202,0,0.8); text-decoration: none; cursor: pointer; transition: color 0.15s; }
        .mark-read-link:hover { color: var(--accent-light); }
        .notif-dropdown-body { overflow-y: auto; padding: 10px; flex: 1; }
        .notif-dropdown-body::-webkit-scrollbar { display: none; }
        .notif-dropdown-body { -ms-overflow-style: none; scrollbar-width: none; }
        .notif-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; padding-right: 38px; background: rgba(255,255,255,0.028); border: 1px solid var(--glass-border); border-radius: 12px; margin-bottom: 8px; position: relative; transition: background 0.15s; }
        .notif-item:last-child { margin-bottom: 0; }
        .notif-item.unread { background: rgba(119,202,0,0.06); border-color: rgba(119,202,0,0.16); border-left: 2px solid var(--accent); }
        .notif-dismiss { position: absolute; top: 9px; right: 9px; width: 20px; height: 20px; background: transparent; border: none; border-radius: 5px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-faint); font-size: 12px; transition: background 0.15s, color 0.15s; padding: 0; }
        .notif-dismiss:hover { background: var(--danger-bg); color: var(--danger); }
        .notif-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
        .notif-msg   { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

        .notif-empty { text-align: center; padding: 28px; font-size: 13px; color: var(--text-faint); }

        /* ── Toast ────────────────────────────────────────────────── */
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { padding: 12px 18px; background: #16161f; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; font-size: 13.5px; font-weight: 500; color: #f1f1f5; box-shadow: 0 8px 24px rgba(0,0,0,0.4); animation: toastIn 0.3s cubic-bezier(0.22,1,0.36,1) forwards; pointer-events: auto; display: flex; align-items: center; gap: 10px; }
        .toast.out { animation: toastOut 0.25s ease forwards; }
        @keyframes toastIn  { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:translateX(0); } }
        @keyframes toastOut { from { opacity:1; transform:translateX(0); } to { opacity:0; transform:translateX(16px); } }

        /* ── Sidebar/Theme toggles ────────────────────────────────── */
        .sidebar-toggle { width: 36px; height: 36px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 9px; display: none; align-items: center; justify-content: center; cursor: pointer; color: var(--text); flex-shrink: 0; transition: background 0.15s; }

        .theme-btn { width: 36px; height: 36px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); flex-shrink: 0; transition: background 0.2s, box-shadow 0.2s; }
        .theme-btn:hover { background: rgba(119,202,0,0.1); box-shadow: 0 0 0 2px rgba(119,202,0,0.2); }
        .sidebar-overlay { display: none; position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); }

        /* ── Responsive ───────────────────────────────────────────── */
        @media (max-width: 1100px) {
            .payslips-layout { grid-template-columns: 1fr; }
            .payslip-list { max-height: 420px; }

        @media (max-width: 768px) {

            .sidebar.mobile-open { transform: translateX(0); }

            .salary-breakdown { grid-template-columns: 1fr 1fr; }
        }
    </style>

<script>

    // ── AUTH GUARD ────────────────────────────────────────────────────
    (function() {
        const role = sessionStorage.getItem('bhr_role');
        if (!role || role !== 'employee') {
            window.location.replace('../login.html');
        }
    })();


    // ── Topbar helpers ────────────────────────────────────────────────
    function setGreeting(firstName) {
        const h = new Date().getHours();
        const g = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
        document.getElementById('topbarGreeting').textContent = `${g}, ${firstName} 👋`;
    }
    function setDate() {
        document.getElementById('topbarDate').textContent = new Date().toLocaleDateString('en-IN', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
        });
    }
    function setAvatar(fullName) {
        const initials = fullName.trim().split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        document.getElementById('userAvatar').textContent = initials;
    }


    // ── Formatting helpers ────────────────────────────────────────────
    function fmtCurrency(n) {
        return '₹' + Number(n).toLocaleString('en-IN');
    }
    function fmtMonth(monthStr) {
        // "2026-03" → "March 2026"
        const [y, m] = monthStr.split('-');
        return new Date(y, m - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
    }
    function fmtDate(iso) {
        if (!iso) return '—';
        return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }


    // ── Render: Last Salary Card ──────────────────────────────────────
    function renderSalaryCard(salary) {
        const card = document.getElementById('salaryCard');
        if (!salary || !salary.month) {
            card.innerHTML = `
                <div class="empty-state" style="padding:24px;text-align:center">
                    <div class="empty-icon" style="font-size:28px;margin-bottom:8px;color:var(--text-faint)"><i class="ph ph-receipt"></i></div>
                    <div class="empty-title" style="font-size:14px;font-weight:600;margin-bottom:4px">No issued payslip yet</div>
                    <div class="empty-msg" style="font-size:12px;color:var(--text-muted)">Your latest payslip details will be displayed here once generated by HR/Finance.</div>
                </div>`;
            return;
        }

        const statusMap = {
            issued: { label: 'Issued', cls: 'issued', icon: 'ph-check-circle' },
            draft:  { label: 'Draft',  cls: 'draft',  icon: 'ph-clock'        },
        };
        const s = statusMap[salary.paymentStatus] || statusMap[salary.status] || { label: 'Issued', cls: 'issued', icon: 'ph-check-circle' };

        card.innerHTML = `
            <div class="salary-top">
                <div>
                    <div class="salary-label-row">
                        <span class="salary-label">Last Issued Payslip</span>
                        <span class="salary-month">${fmtMonth(salary.month)}</span>
                    </div>
                    <div class="salary-amount"><span>₹</span>${Number(salary.netSalary || 0).toLocaleString('en-IN')}</div>
                </div>
                <span class="salary-status-badge ${s.cls}">
                    <i class="ph-fill ${s.icon}" style="font-size:14px"></i>
                    ${s.label}
                </span>
            </div>
            <div class="salary-breakdown">
                <div class="breakdown-item">
                    <div class="breakdown-label">Base Salary</div>
                    <div class="breakdown-value base">${fmtCurrency(salary.baseSalary || 0)}</div>
                </div>
                <div class="breakdown-item">
                    <div class="breakdown-label">Bonus</div>
                    <div class="breakdown-value bonus">+${fmtCurrency(salary.bonus || 0)}</div>
                </div>
                <div class="breakdown-item">
                    <div class="breakdown-label">Deductions</div>
                    <div class="breakdown-value deductions">−${fmtCurrency(salary.deductions || 0)}</div>
                </div>
            </div>`;
    }


    // ── Render: Payslips List ──────────────────────────────────────────
    function renderPayslips(payslips) {
        const container = document.getElementById('payslipsContent');
        document.getElementById('payslipsCount').textContent = payslips.length;

        if (!payslips.length) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><i class="ph ph-receipt"></i></div>
                    <div class="empty-title">No payslips yet</div>
                    <div class="empty-msg">Your payslips will appear here once they are issued by the finance team.</div>
                </div>`;
            return;
        }

        container.innerHTML = payslips.map(p => {
            // 'issued' is the final/success state; 'draft' is pending
            const st = p.status || p.paymentStatus || 'issued';
            const isIssued = st === 'issued';
            const badgeCls = isIssued ? 'issued' : 'draft';
            const badgeLabel = isIssued ? 'Issued' : 'Draft';
            // Optional payment reference (for audit trail)
            const refHtml = p.paymentRef
                ? `<div class="payslip-net" style="font-size:11px;color:var(--text-faint);margin-top:1px;">Ref: ${escapeHtml(p.paymentRef)}</div>`
                : '';
            return `
            <div class="payslip-row">
                <div class="payslip-main">
                    <div class="payslip-month">${fmtMonth(p.month)}</div>
                    <div class="payslip-net">Net Pay: ${fmtCurrency(p.netSalary)}</div>
                    ${refHtml}
                </div>
                <div class="payslip-right">
                    <span class="status-badge ${badgeCls}">${badgeLabel}</span>
                    ${isIssued ? `<button class="download-btn" onclick="handleDownload('${escapeHtml(p.month)}')">
                        <i class="ph-fill ph-download-simple" style="font-size:13px"></i>
                        PDF
                    </button>` : ''}
                </div>
            </div>`;
        }).join('');
    }


    // ── Render: Advance History ───────────────────────────────────────
    function renderAdvanceHistory(advances) {
        const container = document.getElementById('advanceContent');
        document.getElementById('advanceCount').textContent = advances.length;

        if (!advances.length) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><i class="ph ph-hand-coins"></i></div>
                    <div class="empty-title">No advance requests</div>
                    <div class="empty-msg">Your salary advance requests will appear here.</div>
                </div>`;
            return;
        }

        container.innerHTML = advances.map(a => {
            const comment = (a.status === 'rejected' && a.adminDecision?.comment)
                ? `<div class="advance-comment">"${a.adminDecision.comment}"</div>` : '';
            return `
                <div class="advance-row">
                    <div class="advance-icon"><i class="ph-fill ph-hand-coins"></i></div>
                    <div class="advance-main">
                        <div class="advance-amount">${fmtCurrency(a.amount)}</div>
                        <div class="advance-reason">${a.reason || '—'}</div>
                        <div class="advance-date">${fmtDate(a.createdAt)}</div>
                        ${comment}
                    </div>
                    <div class="advance-right">
                        <span class="status-badge ${a.status}">${capitalize(a.status)}</span>
                    </div>
                </div>`;
        }).join('');
    }


    // ── Download handler (mock) ───────────────────────────────────────
    function handleDownload(month) {
        showToast('info', `PDF download coming soon — ${fmtMonth(month)} payslip`);
    }


    // ── Advance form ──────────────────────────────────────────────────
    function checkAdvanceReady() {
        const amount = document.getElementById('advanceAmount').value.trim();
        const reason = document.getElementById('advanceReason').value.trim();
        document.getElementById('advanceSubmitBtn').disabled = !(amount && Number(amount) >= 500 && reason.length >= 5);
    }

    async function handleAdvanceSubmit() {
        const amount = Number(document.getElementById('advanceAmount').value.trim());
        const reason = document.getElementById('advanceReason').value.trim();
        const btn = document.getElementById('advanceSubmitBtn');

        btn.disabled = true;
        btn.innerHTML = `<span class="btn-spinner"></span> Submitting…`;

        try {
            const result = await db.requestSalaryAdvance({ amount, reason });
            document.getElementById('advanceAmount').value = '';
            document.getElementById('advanceReason').value = '';
            btn.innerHTML = `<i class="ph-fill ph-paper-plane-tilt" style="font-size:15px"></i> Submit Request`;
            checkAdvanceReady();
            showToast('success', `Advance request for ${fmtCurrency(amount)} submitted!`);
            // Prepend new entry to advance history
            const advances = await db.getAdvanceHistory();
            renderAdvanceHistory(advances);
        } catch (err) {
            btn.disabled = false;
            btn.innerHTML = `<i class="ph-fill ph-paper-plane-tilt" style="font-size:15px"></i> Submit Request`;
            showToast('error', 'Something went wrong. Please try again.');
        }
    }


    // ── Notifications ──────────────────────────────────────────────────
    function renderNotifications(notifs) {
        const list   = document.getElementById('notifDropdownList');
        const badge  = document.getElementById('notifBadge');
        const unread = notifs.filter(n => !n.read).length;
        if (unread > 0) { badge.textContent = unread; badge.style.display = 'flex'; }
        if (!notifs.length) { list.innerHTML = '<div class="notif-empty">No notifications yet</div>'; return; }
        list.innerHTML = notifs.map(n => `
            <div class="notif-item ${n.read ? '' : 'unread'}" data-notif-id="${n.notificationId}">
                <div>
                    <div class="notif-title">${n.title}</div>
                    <div class="notif-msg">${n.message}</div>
                    <div class="notif-time">${fmtDate(n.createdAt)}</div>
                </div>
                <button class="notif-dismiss" onclick="dismissNotif(this)" aria-label="Dismiss">
                    <i class="ph ph-x"></i>
                </button>
            </div>`).join('');
    }

    function dismissNotif(btn) {
        const wasUnread = btn.closest('.notif-item').classList.contains('unread');
        btn.closest('.notif-item').remove();
        if (wasUnread) {
            const unread = document.querySelectorAll('#notifDropdownList .notif-item.unread').length;
            const badge  = document.getElementById('notifBadge');
            badge.style.display = unread > 0 ? 'flex' : 'none';
            if (unread > 0) badge.textContent = unread;
        }
        if (!document.querySelector('#notifDropdownList .notif-item')) {
            document.getElementById('notifDropdownList').innerHTML = '<div class="notif-empty">No notifications</div>';
        }
    }

    function toggleNotifDropdown(e) {
        e.stopPropagation();
        document.getElementById('notifDropdown').classList.toggle('open');
    }
    document.addEventListener('click', function() {
        const d = document.getElementById('notifDropdown');
        if (d) d.classList.remove('open');
    });

    function markAllRead() {
        document.querySelectorAll('#notifDropdownList .notif-item').forEach(el => el.remove());
        document.getElementById('notifBadge').style.display = 'none';
        document.getElementById('notifDropdownList').innerHTML = '<div class="notif-empty">No notifications</div>';
        showToast('success', 'All notifications marked as read');
    }


    // ── Toast ──────────────────────────────────────────────────────────
    function showToast(type, message) {
        const icons = { success: 'ph-check-circle', error: 'ph-x-circle', info: 'ph-info', warning: 'ph-warning' };
        const colors = { success: '#4ade80', error: '#f87171', info: '#60a5fa', warning: '#fbbf24' };
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<i class="ph-fill ${icons[type] || icons.info}" style="font-size:18px;color:${colors[type]};flex-shrink:0"></i>${message}`;
        container.appendChild(toast);
        setTimeout(() => { toast.classList.add('out'); setTimeout(() => toast.remove(), 260); }, 3500);
    }


    // ── Sidebar & Theme ────────────────────────────────────────────────
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if (window.innerWidth <= 768) {
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('open');
        } else {
            sidebar.classList.toggle('collapsed');
        }
    }
    function closeSidebar() {
        document.getElementById('sidebar').classList.remove('mobile-open');
        document.getElementById('sidebarOverlay').classList.remove('open');
    }

    function _applyTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('bhr_theme', t);
        const btn     = document.getElementById('themeToggle');
        if (!btn) return;
        const sunSVG  = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
        const moonSVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
        btn.innerHTML = t === 'dark' ? sunSVG : moonSVG;
        btn.title     = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    }
    function toggleTheme() {
        _applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }

    function handleLogout() {
        db.endSession('manual');
        sessionStorage.removeItem('bhr_role');
        sessionStorage.removeItem('bhr_email');
        window.location.replace('../login.html');
    }

    function capitalize(str) {
        if (!str) return '';
        return str.charAt(0).toUpperCase() + str.slice(1).replace(/_/g, ' ');
    }


    // ── Init ──────────────────────────────────────────────────────────
    async function init() {
        _applyTheme(localStorage.getItem('bhr_theme') || 'dark');
        setDate();

        try {
            const [profile, salary, payslips, advances, notifs] = await Promise.all([
                db.getEmployeeProfile(),
                db.getLastSalary(),
                db.getPayslips(),
                db.getAdvanceHistory(),
                db.getNotifications(),
            ]);

            setGreeting(profile.fullName.split(' ')[0]);
            setAvatar(profile.fullName);
            renderSalaryCard(salary);
            renderPayslips(payslips);
            renderAdvanceHistory(advances);
            renderNotifications(notifs);
        } catch (err) {
            showToast('error', 'Failed to load salary data. Please refresh.');
        }
        checkProfileCompleteness();
        db.startIdleWatcher(handleLogout);
    }

    async function checkProfileCompleteness() {
        try {
            const p2 = await db.getEmployeeProfile();
            const incomplete = !p2.address ||
                               !p2.emergencyContact?.name ||
                               !p2.emergencyContact?.phone ||
                               !p2.emergencyContact?.relation;
            const badge = document.getElementById('profileNavBadge');
            if (badge) badge.style.display = incomplete ? 'flex' : 'none';
        } catch {}
    }

    init();

</script>
</body>
</html>
