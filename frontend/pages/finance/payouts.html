<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeanHR — Finance Payouts</title>
    <script>(function(){var t=localStorage.getItem('bhr_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --accent:#77ca00; --accent-light:#a0e040; --accent-glow:rgba(119,202,0,0.35);
            --brown:#a86a3e; --brown-light:#c8854a; --brown-glow:rgba(168,106,62,0.25);
            --bg:#07070f; --text:#f1f1f5; --text-muted:rgba(241,241,245,0.55);
            --text-faint:rgba(241,241,245,0.2); --icon-faint:rgba(241,241,245,0.3);
            --icon-muted:rgba(241,241,245,0.65); --glass-bg:rgba(255,255,255,0.04);
            --glass-border:rgba(255,255,255,0.08); --sidebar-w:240px; --topbar-h:64px;
            --success:#4ade80; --success-bg:rgba(74,222,128,0.12);
            --warning:#fbbf24; --warning-bg:rgba(251,191,36,0.12);
            --danger:#f87171;  --danger-bg:rgba(248,113,113,0.12);
            --blue:#60a5fa;    --blue-bg:rgba(96,165,250,0.12);
        }
        [data-theme="light"] {
            --bg:#f0f6e8; --accent:#5a9900; --accent-light:#77ca00; --accent-glow:rgba(90,153,0,0.2);
            --text:#1a2010; --text-muted:rgba(26,32,16,0.58); --text-faint:rgba(26,32,16,0.35);
            --icon-faint:rgba(26,32,16,0.32); --icon-muted:rgba(26,32,16,0.65);
            --glass-bg:rgba(255,255,255,0.82); --glass-border:rgba(26,32,16,0.1);
            --success-bg:rgba(50,140,70,0.1); --warning-bg:rgba(180,130,0,0.09);
            --danger-bg:rgba(200,50,50,0.08); --blue-bg:rgba(50,100,200,0.08);
        }
        [data-theme="light"] .bg { background: radial-gradient(ellipse at 15% 55%, rgba(90,153,0,0.1) 0%, transparent 55%), #f0f6e8; }
        [data-theme="light"] .orb     { opacity: 0.18; }
        [data-theme="light"] .sidebar { background: rgba(255,255,255,0.88); }
        [data-theme="light"] .topbar  { background: rgba(240,246,232,0.94); border-bottom-color: rgba(0,0,0,0.07); }
        [data-theme="light"] .card    { box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
        [data-theme="light"] .nav-item:hover { background: rgba(0,0,0,0.04); }
        [data-theme="light"] .notif-btn, [data-theme="light"] .theme-btn { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.1); }
        [data-theme="light"] .notif-dropdown { background: #ffffff; box-shadow: 0 8px 32px rgba(0,0,0,0.15); border-color: rgba(0,0,0,0.1); }
        [data-theme="light"] .notif-item { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.08); }
        [data-theme="light"] .notif-item.unread { background: rgba(90,153,0,0.07); border-color: rgba(90,153,0,0.2); }
        [data-theme="light"] .mark-read-link { color: #4a7000; }
        [data-theme="light"] .modal-box { background: rgba(255,255,255,0.98); box-shadow: 0 24px 64px rgba(0,0,0,0.18); }
        [data-theme="light"] .modal-input { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.1); color: var(--text); }
        [data-theme="light"] .modal-input:focus { border-color: var(--accent); }
        [data-theme="light"] .payout-row { border-color: rgba(26,32,16,0.06); }
        [data-theme="light"] .payout-row:hover { background: rgba(0,0,0,0.02); }
        [data-theme="light"] .breakdown-expand { background: rgba(0,0,0,0.02); border-color: rgba(0,0,0,0.05); }
        [data-theme="light"] .modal-backdrop { background: rgba(0,0,0,0.3); }

        .ph-icon-fill    { display: block; }
        .ph-icon-outline { display: none;  }
        [data-theme="light"] .ph-icon-fill    { display: none;  }
        [data-theme="light"] .ph-icon-outline { display: block; }

        html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
        .bg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at 15% 55%, rgba(119,202,0,0.13) 0%, transparent 55%), radial-gradient(ellipse at 85% 15%, rgba(160,224,64,0.09) 0%, transparent 50%), var(--bg); }
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.4; animation: drift linear infinite; }
        .orb-1 { width:550px; height:550px; background:radial-gradient(circle, rgba(119,202,0,0.2), transparent 70%); top:-180px; left:-120px; animation-duration:22s; }
        .orb-2 { width:420px; height:420px; background:radial-gradient(circle, rgba(160,224,64,0.14), transparent 70%); bottom:-110px; right:-90px; animation-duration:28s; animation-direction:reverse; }
        .orb-3 { width:320px; height:320px; background:radial-gradient(circle, rgba(99,179,255,0.1), transparent 70%); top:38%; right:18%; animation-duration:34s; }
        @keyframes drift { 0%{transform:translate(0,0) scale(1)} 33%{transform:translate(28px,-28px) scale(1.06)} 66%{transform:translate(-18px,18px) scale(0.95)} 100%{transform:translate(0,0) scale(1)} }
        .app-shell { position: relative; z-index: 1; display: flex; height: 100vh; overflow: hidden; }

        /* ── Sidebar ── */
        .sidebar { width: var(--sidebar-w); height: 100vh; flex-shrink: 0; display: flex; flex-direction: column; background: rgba(255,255,255,0.025); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-right: 1px solid var(--glass-border); padding: 24px 14px; overflow: hidden; overflow-y: auto; transition: width 0.28s cubic-bezier(0.22,1,0.36,1); }
        .sidebar.collapsed { width: 64px; }
        .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 0 4px 22px; border-bottom: 1px solid var(--glass-border); margin-bottom: 14px; white-space: nowrap; }
        .brand-toggle { width: 36px; height: 36px; min-width: 36px; flex-shrink: 0; background: linear-gradient(135deg, var(--accent), var(--accent-light)); border-radius: 10px; border: none; cursor: pointer; position: relative; box-shadow: 0 4px 16px var(--accent-glow); transition: box-shadow 0.2s; padding: 0; }
        .brand-toggle:hover { box-shadow: 0 4px 24px var(--accent-glow), 0 0 0 2px rgba(119,202,0,0.4); }
        .brand-logo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: #fff; opacity: 1; transform: rotate(0deg); transition: opacity 0.25s, transform 0.42s cubic-bezier(0.22,1,0.36,1); pointer-events: none; }
        .brand-hamburger { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; opacity: 0; transform: rotate(-90deg); transition: opacity 0.25s, transform 0.42s cubic-bezier(0.22,1,0.36,1); pointer-events: none; }
        .brand-hamburger span { display: block; width: 14px; height: 1.5px; background: #fff; border-radius: 2px; }
        .sidebar.collapsed .brand-logo { opacity: 0; transform: rotate(90deg); }
        .sidebar.collapsed .brand-hamburger { opacity: 1; transform: rotate(0deg); }
        .sidebar-brand-text { overflow: hidden; max-width: 160px; transition: opacity 0.22s, max-width 0.28s cubic-bezier(0.22,1,0.36,1); }
        .sidebar-brand-name { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; white-space: nowrap; }
        .sidebar-brand-tag  { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 1px; }
        .sidebar.collapsed .sidebar-brand-text { opacity: 0; max-width: 0; }
        .sidebar-section-label { font-size: 10px; font-weight: 600; color: var(--brown); text-transform: uppercase; letter-spacing: 1.5px; padding: 0 10px; margin: 8px 0 6px; display: block; white-space: nowrap; overflow: hidden; max-height: 30px; transition: opacity 0.2s, max-height 0.28s, margin 0.28s; }
        .sidebar.collapsed .sidebar-section-label { opacity: 0; max-height: 0; margin: 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 9px; border-radius: 10px; font-size: 13.5px; font-weight: 500; color: var(--text-muted); text-decoration: none; transition: background 0.15s, color 0.15s; margin-bottom: 2px; position: relative; white-space: nowrap; overflow: hidden; }
        .nav-item:hover  { background: rgba(255,255,255,0.05); color: var(--text); }
        .nav-item.active { background: rgba(119,202,0,0.14); color: var(--accent-light); }
        .nav-item.active .nav-icon { color: var(--accent-light); }
        [data-theme="light"] .nav-item.active { color: var(--accent); }
        [data-theme="light"] .nav-item.active .nav-icon { color: var(--accent); }
        .nav-icon { width: 20px; height: 20px; min-width: 20px; font-size: 20px; flex-shrink: 0; color: var(--icon-faint); transition: color 0.15s; display: flex; align-items: center; justify-content: center; }
        .nav-item:hover .nav-icon { color: var(--icon-muted); }
        .nav-label { overflow: hidden; max-width: 160px; white-space: nowrap; transition: opacity 0.2s, max-width 0.28s cubic-bezier(0.22,1,0.36,1); }
        .sidebar.collapsed .nav-label { opacity: 0; max-width: 0; }
        .sidebar.collapsed .nav-item  { justify-content: center; padding: 10px 0; gap: 0; }
        .sidebar.collapsed .logout-btn { justify-content: center; padding: 10px 0; gap: 0; }
        .sidebar.collapsed .sidebar-brand { padding-left: 0; gap: 0; }
        .nav-item[data-tip] { position: relative; }
        .sidebar.collapsed .nav-item[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%); background: rgba(22,22,38,0.96); border: 1px solid var(--glass-border); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; font-weight: 500; color: var(--text); white-space: nowrap; pointer-events: none; z-index: 200; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
        .sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--glass-border); overflow: hidden; }
        .logout-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 9px; background: none; border: none; border-radius: 10px; font-size: 13.5px; font-weight: 500; color: rgba(248,113,113,0.65); cursor: pointer; transition: background 0.15s, color 0.15s; white-space: nowrap; overflow: hidden; }
        .logout-btn:hover { background: rgba(248,113,113,0.09); color: var(--danger); }
        .logout-label { overflow: hidden; max-width: 160px; white-space: nowrap; transition: opacity 0.2s, max-width 0.28s cubic-bezier(0.22,1,0.36,1); }
        .sidebar.collapsed .logout-label { opacity: 0; max-width: 0; }

        /* ── Main ── */
        .main-area { flex: 1; overflow-y: auto; height: 100vh; display: flex; flex-direction: column; min-width: 0; scrollbar-width: none; -ms-overflow-style: none; }
        .main-area::-webkit-scrollbar { display: none; }
        .topbar { height: var(--topbar-h); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: rgba(7,7,15,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 10; }
        .topbar-left { display: flex; align-items: center; gap: 14px; }
        .topbar-greeting { font-size: 16px; font-weight: 600; }
        .topbar-sub { font-size: 12px; color: var(--text-muted); }
        .topbar-right { display: flex; align-items: center; gap: 12px; }
        .theme-btn, .notif-btn { position: relative; width: 38px; height: 38px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); transition: background 0.15s, color 0.15s; overflow: visible; padding: 0; font-size: 18px; }
        .theme-btn:hover, .notif-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
        .notif-badge { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; background: var(--accent); border-radius: 8px; font-size: 10px; font-weight: 700; color: #fff; display: flex; align-items: center; justify-content: center; padding: 0 4px; border: 2px solid var(--bg); }
        .avatar { width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent), var(--accent-light)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; box-shadow: 0 2px 12px var(--accent-glow); }
        .page-content { padding: 24px; flex: 1; }
        .card { background: var(--glass-bg); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border: 1px solid var(--glass-border); border-radius: 18px; padding: 22px; box-shadow: 0 8px 32px rgba(0,0,0,0.28), 0 0 0 1px rgba(255,255,255,0.02) inset; }

        /* ── Tabs ── */
        .tab-bar { display: flex; gap: 4px; margin-bottom: 24px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 4px; width: fit-content; }
        .tab-btn { padding: 7px 18px; border-radius: 8px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; background: none; color: var(--text-muted); transition: background 0.15s, color 0.15s; }
        .tab-btn.active { background: rgba(119,202,0,0.15); color: var(--accent-light); }
        [data-theme="light"] .tab-btn.active { background: rgba(90,153,0,0.1); color: var(--accent); }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* ── Card Header ── */
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .card-title  { font-size: 14px; font-weight: 600; }

        /* ── Payout Row ── */
        .payout-row { display: flex; align-items: flex-start; gap: 14px; padding: 15px 10px; border-bottom: 1px solid var(--glass-border); transition: background 0.12s; }
        .payout-row:last-child { border-bottom: none; }
        .payout-row:hover { background: rgba(255,255,255,0.025); border-radius: 10px; }
        .payout-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 19px; }
        .payout-icon.advance    { background: rgba(251,191,36,0.12);  color: var(--warning); }
        .payout-icon.settlement { background: rgba(248,113,113,0.12); color: var(--danger); }
        .payout-icon.disbursed  { background: var(--success-bg);      color: var(--success); }
        .payout-info { flex: 1; min-width: 0; }
        .payout-name { font-size: 13.5px; font-weight: 500; }
        .payout-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
        .payout-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
        .payout-amount { font-size: 15px; font-weight: 700; }
        .payout-amount.warn  { color: var(--warning); }
        .payout-amount.red   { color: var(--danger); }
        .payout-amount.green { color: var(--success); }
        .status-badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .status-badge.pending   { background: var(--warning-bg);  color: var(--warning); }
        .status-badge.disbursed { background: var(--success-bg);  color: var(--success); }
        .status-badge.release   { background: var(--danger-bg);   color: var(--danger); }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 4px; }
        .btn-sm { padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; transition: all 0.15s; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
        .btn-sm.disburse { background: var(--accent); color: #07070f; box-shadow: 0 2px 8px var(--accent-glow); }
        .btn-sm.disburse:hover { background: var(--accent-light); box-shadow: 0 4px 16px var(--accent-glow); transform: translateY(-1px); }
        .btn-sm.outline { background: none; border: 1px solid var(--glass-border); color: var(--text-muted); }
        .btn-sm.outline:hover { background: var(--glass-bg); color: var(--text); }
        [data-theme="light"] .btn-sm.disburse { color: #fff; }
        [data-theme="light"] .btn-sm.danger  { color: #fff; }
        .empty-state { text-align: center; padding: 48px 24px; font-size: 13px; color: var(--text-faint); }

        /* ── Breakdown Expand ── */
        .breakdown-expand { margin-top: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 12px; padding: 14px 16px; display: none; }
        .breakdown-expand.open { display: block; }
        .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        .bd-row:last-child { border-bottom: none; }
        .bd-label { color: var(--text-muted); }
        .bd-value { font-weight: 600; }
        .bd-total { color: var(--danger); font-size: 15px; font-weight: 700; }

        /* ── Confirm Modal ── */
        .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); align-items: center; justify-content: center; }
        .modal-backdrop.open { display: flex; }
        .modal-box { background: #13131e; border: 1px solid var(--glass-border); border-radius: 22px; padding: 28px; width: 90%; max-width: 480px; box-shadow: 0 24px 64px rgba(0,0,0,0.5); position: relative; }
        .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--text-faint); font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: background 0.15s; }
        .modal-close:hover { background: var(--danger-bg); color: var(--danger); }
        .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .modal-desc  { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6; }
        .modal-label { font-size: 12px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; display: block; }
        .modal-input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border); border-radius: 10px; color: var(--text); font-size: 13px; font-family: inherit; padding: 10px 13px; transition: border-color 0.15s; resize: vertical; min-height: 70px; }
        .modal-input:focus { outline: none; border-color: var(--accent); }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .modal-btn { padding: 9px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; transition: all 0.15s; }
        .modal-btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: #fff; box-shadow: 0 4px 14px var(--accent-glow); }
        .modal-btn.primary:hover { box-shadow: 0 6px 20px var(--accent-glow); transform: translateY(-1px); }
        .modal-btn.secondary { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-muted); }
        .modal-btn.secondary:hover { color: var(--text); background: rgba(255,255,255,0.06); }
        .modal-btn.danger { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(248,113,113,0.25); }
        .modal-btn.danger:hover { background: rgba(248,113,113,0.22); }

        /* ── Notifications ── */
        .notif-dropdown { position: absolute; top: calc(100% + 10px); right: 0; width: 340px; max-height: 440px; background: #16161f; border: 1px solid var(--glass-border); border-radius: 18px; box-shadow: 0 16px 48px rgba(0,0,0,0.6); z-index: 200; display: flex; flex-direction: column; opacity: 0; transform: translateY(-6px) scale(0.97); pointer-events: none; transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.22,1,0.36,1); }
        .notif-dropdown.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
        .notif-dropdown-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; border-bottom: 1px solid var(--glass-border); flex-shrink: 0; }
        .notif-dropdown-title { font-size: 14px; font-weight: 600; }
        .mark-read-link { font-size: 12px; color: rgba(119,202,0,0.8); text-decoration: none; cursor: pointer; transition: color 0.15s; }
        .mark-read-link:hover { color: var(--accent-light); }
        .notif-dropdown-body { overflow-y: auto; padding: 10px; flex: 1; scrollbar-width: none; -ms-overflow-style: none; }
        .notif-dropdown-body::-webkit-scrollbar { display: none; }
        .notif-empty { text-align: center; padding: 28px; font-size: 13px; color: var(--text-faint); }
        .notif-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: rgba(255,255,255,0.028); border: 1px solid var(--glass-border); border-radius: 10px; margin-bottom: 6px; }
        .notif-item.unread { background: rgba(119,202,0,0.06); border-color: rgba(119,202,0,0.16); border-left: 2px solid var(--accent); }
        .notif-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
        .notif-msg   { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
        .notif-dismiss { border: none; background: none; color: var(--text-faint); cursor: pointer; font-size: 12px; padding: 2px; border-radius: 4px; transition: background 0.15s; line-height: 1; }
        .notif-dismiss:hover { background: var(--danger-bg); color: var(--danger); }

        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { padding: 14px 16px; background: #16161f; border: 1px solid var(--glass-border); border-radius: 12px; font-size: 13px; color: #f1f1f5; box-shadow: 0 8px 24px rgba(0,0,0,0.4); animation: slideIn 0.3s cubic-bezier(0.22,1,0.36,1); pointer-events: auto; }
        .toast.success { border-color: rgba(74,222,128,0.3); }
        .toast.error   { border-color: rgba(248,113,113,0.3); }
        [data-theme="light"] .toast { background: #ffffff; color: #1a2010; box-shadow: 0 8px 24px rgba(0,0,0,0.12); border-color: rgba(0,0,0,0.1); }
        @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (max-width: 640px) { .sidebar { width: 64px; } .topbar { padding: 0 16px; } .page-content { padding: 16px; } }

<body>

        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>

    <div class="app-shell">

        <!-- ── SIDEBAR ── -->
        <aside class="sidebar" id="sidebar">

            <a href="dashboard.html" class="nav-item" data-tip="Dashboard">

                <span class="nav-label">Payroll</span>
            </a>
            <a href="payouts.html" class="nav-item active" data-tip="Payouts">
                <span class="nav-icon"><i class="ph-fill ph-hand-coins ph-icon-fill"></i><i class="ph ph-hand-coins ph-icon-outline"></i></span>
                <span class="nav-label">Payouts</span>
            </a>
            <a href="reports.html" class="nav-item" data-tip="Reports">
                <span class="nav-icon"><i class="ph-fill ph-chart-bar ph-icon-fill"></i><i class="ph ph-chart-bar ph-icon-outline"></i></span>

            </a>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <span class="nav-icon"><i class="ph-fill ph-sign-out ph-icon-fill"></i><i class="ph ph-sign-out ph-icon-outline"></i></span>
                    <span class="logout-label">Logout</span>

        <!-- ── MAIN AREA ── -->
        <div class="main-area">
            <div class="topbar">

                    <div>
                        <div class="topbar-greeting">Payouts</div>

                    </div>
                </div>
                <div class="topbar-right">
                    <button class="theme-btn" onclick="toggleTheme()">
                        <i class="ph-fill ph-sun ph-icon-fill" style="font-size:18px"></i>
                        <i class="ph ph-moon ph-icon-outline" style="font-size:18px"></i>
                    </button>
                    <div style="position:relative;">
                        <button class="notif-btn" onclick="toggleNotifDropdown(event)">
                            <i class="ph-fill ph-bell ph-icon-fill" style="font-size:18px"></i>
                            <i class="ph ph-bell ph-icon-outline" style="font-size:18px"></i>
                            <span class="notif-badge" id="notifBadge" style="display:none;"></span>
                        </button>
                        <div class="notif-dropdown" id="notifDropdown">
                            <div class="notif-dropdown-head">
                                <div class="notif-dropdown-title">Notifications</div>

                            <div class="notif-dropdown-body" id="notifDropdownBody"><div class="notif-empty">No notifications</div></div>
                        </div>

            <div class="page-content">

                <!-- TABS -->
                <div class="tab-bar">
                    <button class="tab-btn active" onclick="switchTab('advances', this)">Salary Advances</button>
                    <button class="tab-btn" onclick="switchTab('settlements', this)">F&amp;F Settlements</button>
                </div>

                <!-- ── ADVANCES TAB ── -->
                <div class="tab-pane active" id="tab-advances">
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Salary Advances</div>
                        </div>
                        <div id="advanceList">
                            <div class="empty-state">Loading advances…</div>
                        </div>
                    </div>
                </div>

                <!-- ── SETTLEMENTS TAB ── -->
                <div class="tab-pane" id="tab-settlements">

    <!-- ── DISBURSE CONFIRM MODAL ── -->
    <div class="modal-backdrop" id="disburseModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal('disburseModal')">&#x2715;</button>
            <div class="modal-title">Mark as Disbursed</div>
            <div class="modal-desc" id="disburseDesc">Mark salary advance for <strong id="disburseEmpName"></strong> of <strong id="disburseAmount"></strong> as disbursed externally?</div>
            <label class="modal-label">Payment Reference / UTR <span style="font-size:11px;font-weight:400;color:var(--text-faint)">(optional)</span></label>
            <input type="text" class="modal-input" id="disbursePaymentRef" placeholder="e.g. UTR123456789 or bank ref">
            <label class="modal-label" style="margin-top:8px">Notes <span style="font-size:11px;font-weight:400;color:var(--text-faint)">(optional)</span></label>
            <textarea class="modal-input" id="disburseNotes" placeholder="e.g. Processed via NEFT on 24 May"></textarea>
            <div class="modal-actions">
                <button class="modal-btn secondary" onclick="closeModal('disburseModal')">Cancel</button>
                <button class="modal-btn primary" onclick="confirmDisburse()">Mark as Disbursed</button>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" id="releaseModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal('releaseModal')">&#x2715;</button>
            <div class="modal-title">Mark F&amp;F as Settled</div>
            <div class="modal-desc" id="releaseDesc"></div>
            <div id="releaseBreakdown"></div>
            <label class="modal-label" style="margin-top:8px">Payment Reference / UTR <span style="font-size:11px;font-weight:400;color:var(--text-faint)">(optional)</span></label>
            <input type="text" class="modal-input" id="releasePaymentRef" placeholder="e.g. UTR123456789 or bank transfer ref" style="margin-top:6px">
            <div class="modal-actions">
                <button class="modal-btn secondary" onclick="closeModal('releaseModal')">Cancel</button>
                <button class="modal-btn primary" onclick="confirmRelease()">Mark as Settled</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="../../js/db.js"></script>
    <script>
        // ── AUTH GUARD ──
        (function() {
            const role = sessionStorage.getItem('bhr_role');
            if (!role || role !== 'finance') window.location.replace('../login.html');
        })();

        // ── STATE ──
        let _pendingDisburseId  = null;
        let _pendingReleaseId   = null;

        // ── THEME / SIDEBAR / UTILS ──
        function _applyTheme(t) { document.documentElement.setAttribute('data-theme', t); }
        function toggleTheme() {
            const next = (localStorage.getItem('bhr_theme') || 'dark') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('bhr_theme', next);
            _applyTheme(next);
        }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
        function toggleNotifDropdown(e) { if (e) e.stopPropagation(); document.getElementById('notifDropdown').classList.toggle('open'); }
        async function markAllRead(e) {
            if (e) e.preventDefault();
            document.querySelectorAll('#notifDropdownBody .notif-item.unread').forEach(el => el.classList.remove('unread'));
            document.getElementById('notifBadge').style.display = 'none';
            showToast('All notifications marked as read', 'success');
            if (window.db && db.markAllNotificationsRead) { try { await db.markAllNotificationsRead(); } catch(err){} }
        }
        async function dismissNotif(e, notificationId) {
            e.stopPropagation();
            const item = e.target.closest('.notif-item');
            if (item) item.remove();
            if (notificationId && window.db && db.deleteNotification) {
                try { await db.deleteNotification(notificationId); } catch(err) {}
            }
        }
        document.addEventListener('click', (e) => {
            const d = document.getElementById('notifDropdown');
            const b = document.querySelector('.notif-btn');
            if (d && b && !d.contains(e.target) && !b.contains(e.target)) d.classList.remove('open');
        });
        function showToast(message, type = 'success') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.textContent = message;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3500);
        }
        function logout() {
            sessionStorage.removeItem('bhr_role');
            sessionStorage.removeItem('bhr_email');
            window.location.replace('../login.html');
        }
        function updateTopbarDate() {
            const now = new Date();
            const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            document.getElementById('todayDate').textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
        }
        function escapeHtml(str) {
            if (!str && str !== 0) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }
        function formatMoney(n) {
            return '₹' + new Intl.NumberFormat('en-IN').format(n || 0);
        }
        function formatDate(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        function closeModal(id) { document.getElementById(id).classList.remove('open'); }

        // ── TABS ──
        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
            if (tab === 'settlements') loadSettlements();
        }

        // ── ADVANCES ──
        async function loadAdvances() {
            const container = document.getElementById('advanceList');
            container.innerHTML = '<div class="empty-state">Loading…</div>';
            try {
                const advances = await db.getApprovedAdvances();
                if (!advances || advances.length === 0) {
                    container.innerHTML = '<div class="empty-state">No advance requests</div>';
                    return;
                }
                container.innerHTML = advances.map(a => {
                    const isDisbursed = a.status === 'disbursed';
                    const iconCls = isDisbursed ? 'disbursed' : 'advance';
                    const badge   = isDisbursed
                        ? '<span class="status-badge disbursed">Disbursed</span>'
                        : '<span class="status-badge pending">Pending Disbursement</span>';
                    const amountCls = isDisbursed ? 'green' : 'warn';
                    return `
                        <div class="payout-row">
                            <div class="payout-icon ${escapeHtml(iconCls)}">
                                <i class="ph-fill ph-coins" style="font-size:18px"></i>
                            </div>
                            <div class="payout-info">
                                <div class="payout-name">${escapeHtml(a.fullName)} <span style="font-size:11px;color:var(--text-faint);margin-left:6px;">${escapeHtml(a.employeeCode)}</span></div>
                                <div class="payout-meta">${escapeHtml(a.designation)} &bull; ${escapeHtml(a.department)}</div>
                                <div class="payout-meta" style="margin-top:3px;">${escapeHtml(a.purpose)}</div>
                                <div class="payout-meta" style="margin-top:3px;">Repayment: ${escapeHtml(a.repaymentMonths)} months &bull; Requested: ${escapeHtml(formatDate(a.requestedAt))}</div>
                                ${isDisbursed ? `<div class="payout-meta" style="margin-top:3px;color:var(--success);">Disbursed ${escapeHtml(formatDate(a.disbursedAt))} &bull; Ref: ${escapeHtml(a.disbursementRef || a.notes || '—')}</div>` : ''}
                            </div>
                            <div class="payout-right">
                                <div class="payout-amount ${escapeHtml(amountCls)}">${formatMoney(a.approvedAmount)}</div>
                                ${badge}
                                ${!isDisbursed ? `<div class="btn-row"><button class="btn-sm disburse" onclick="openDisburseModal('${escapeHtml(a.requestId)}','${escapeHtml(a.fullName)}',${escapeHtml(a.approvedAmount)})"><i class="ph-fill ph-check-circle" style="font-size:13px"></i>Mark as Disbursed</button></div>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = '<div class="empty-state">Failed to load advances</div>';
            }
        }

        function openDisburseModal(requestId, name, amount) {
            _pendingDisburseId = requestId;
            document.getElementById('disburseEmpName').textContent = name;
            document.getElementById('disburseAmount').textContent  = formatMoney(amount);
            document.getElementById('disburseNotes').value = '';
            if (document.getElementById('disbursePaymentRef')) document.getElementById('disbursePaymentRef').value = '';
            document.getElementById('disburseModal').classList.add('open');
        }
        async function confirmDisburse() {
            const notes = document.getElementById('disburseNotes').value.trim();
            const ref   = (document.getElementById('disbursePaymentRef')?.value || '').trim();
            try {
                await db.disburseAdvance(_pendingDisburseId, notes, ref || null);
                closeModal('disburseModal');
                showToast('Advance marked as disbursed', 'success');
                loadAdvances();
            } catch (err) {
                showToast(err.message || 'Failed to mark advance as disbursed', 'error');
            }
        }

        // ── SETTLEMENTS ──
        async function loadSettlements() {
            const container = document.getElementById('settlementList');
            container.innerHTML = '<div class="empty-state">Loading…</div>';
            try {
                const settlements = await db.getPendingSettlements();
                if (!settlements || settlements.length === 0) {
                    container.innerHTML = '<div class="empty-state">No pending settlements</div>';
                    return;
                }
                container.innerHTML = settlements.map(s => {
                    const isSettled  = s.settlementStatus === 'released' || s.settlementStatus === 'settled';
                    const iconCls    = isSettled ? 'disbursed' : 'settlement';
                    const badge      = isSettled
                        ? '<span class="status-badge disbursed">Settled</span>'
                        : '<span class="status-badge release">Pending Settlement</span>';
                    return `
                        <div class="payout-row" id="settlement-${escapeHtml(s.resignationId)}">
                            <div class="payout-icon ${escapeHtml(iconCls)}">
                                <i class="ph-fill ph-handshake" style="font-size:18px"></i>
                            </div>
                            <div class="payout-info">
                                <div class="payout-name">${escapeHtml(s.fullName)} <span style="font-size:11px;color:var(--text-faint);margin-left:6px;">${escapeHtml(s.employeeCode)}</span></div>
                                <div class="payout-meta">${escapeHtml(s.designation)} &bull; ${escapeHtml(s.department)}</div>
                                <div class="payout-meta" style="margin-top:3px;">Last Working Day: <strong>${escapeHtml(formatDate(s.lastWorkingDay))}</strong> &bull; Days Worked: ${escapeHtml(s.daysWorked)}/${escapeHtml(s.totalWorkingDays)}</div>
                                <div id="bdExpand-${escapeHtml(s.resignationId)}" class="breakdown-expand"></div>
                            </div>
                            <div class="payout-right">
                                ${badge}
                                <div class="btn-row">
                                    <button class="btn-sm outline" onclick="toggleBreakdown('${escapeHtml(s.resignationId)}')">View Breakdown</button>
                                    ${!isSettled ? `<button class="btn-sm disburse" onclick="openReleaseModal('${escapeHtml(s.resignationId)}','${escapeHtml(s.fullName)}')"><i class="ph-fill ph-check-circle" style="font-size:13px"></i>Mark as Settled</button>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = '<div class="empty-state">Failed to load settlements</div>';
            }
        }

        async function toggleBreakdown(resignationId) {
            const panel = document.getElementById('bdExpand-' + resignationId);
            if (panel.classList.contains('open')) {
                panel.classList.remove('open');
                return;
            }
            panel.innerHTML = '<div style="font-size:13px;color:var(--text-faint);padding:8px 0;">Loading breakdown…</div>';
            panel.classList.add('open');
            try {
                const d = await db.getSettlementDetails(resignationId);
                const drFmt = d.dailyRate ? '₹' + new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(d.dailyRate) : '—';
                panel.innerHTML = `
                    <div class="bd-row"><span class="bd-label">Base Salary</span><span class="bd-value">${formatMoney(d.baseSalary)}</span></div>
                    <div class="bd-row"><span class="bd-label">Daily Rate (÷ ${escapeHtml(d.totalWorkingDays)} days)</span><span class="bd-value" style="color:var(--text-muted)">${drFmt}</span></div>
                    <div class="bd-row"><span class="bd-label">Days Worked (${escapeHtml(d.daysWorked)}/${escapeHtml(d.totalWorkingDays)})</span><span class="bd-value">${formatMoney(d.proRatedSalary)}</span></div>
                    <div class="bd-row"><span class="bd-label">Unused PL Encashment (${escapeHtml(d.unusedPL)} days)</span><span class="bd-value">${formatMoney(d.plEncashment)}</span></div>
                    <div class="bd-row"><span class="bd-label">Unpaid Bonuses</span><span class="bd-value">${formatMoney(d.unpaidBonusTotal)}</span></div>
                    <div class="bd-row"><span class="bd-label bd-total">Total Payable</span><span class="bd-value bd-total">${formatMoney(d.totalAmount)}</span></div>
                `;
            } catch (err) {
                panel.innerHTML = '<div style="font-size:13px;color:var(--danger);padding:8px 0;">Failed to load breakdown</div>';
            }
        }

        async function openReleaseModal(resignationId, name) {
            _pendingReleaseId = resignationId;
            try {
                const d = await db.getSettlementDetails(resignationId);
                document.getElementById('releaseDesc').innerHTML = `Release F&amp;F settlement of <strong>${formatMoney(d.totalAmount)}</strong> to <strong>${escapeHtml(name)}</strong>?<br><span style="font-size:12px;color:var(--text-faint);">This action cannot be undone.</span>`;
                const drFmt2 = d.dailyRate ? '₹' + new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(d.dailyRate) : '—';
                document.getElementById('releaseBreakdown').innerHTML = `
                    <div style="background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:10px;padding:12px 14px;margin-bottom:4px;">
                        <div class="bd-row"><span class="bd-label">Daily Rate (÷ ${escapeHtml(d.totalWorkingDays)} days)</span><span class="bd-value" style="color:var(--text-muted)">${drFmt2}</span></div>
                        <div class="bd-row"><span class="bd-label">Pro-rated Salary (${escapeHtml(d.daysWorked)} days)</span><span class="bd-value">${formatMoney(d.proRatedSalary)}</span></div>
                        <div class="bd-row"><span class="bd-label">PL Encashment (${escapeHtml(d.unusedPL)} days)</span><span class="bd-value">${formatMoney(d.plEncashment)}</span></div>
                        <div class="bd-row"><span class="bd-label">Unpaid Bonuses</span><span class="bd-value">${formatMoney(d.unpaidBonusTotal)}</span></div>
                        <div class="bd-row"><span class="bd-label" style="font-weight:600;color:var(--danger)">Total</span><span class="bd-value bd-total">${formatMoney(d.totalAmount)}</span></div>
                    </div>
                `;
            } catch (err) {
                document.getElementById('releaseDesc').textContent = 'Unable to load settlement details.';
                document.getElementById('releaseBreakdown').innerHTML = '';
            }
            document.getElementById('releaseModal').classList.add('open');
        }
        async function confirmRelease() {
            const ref = (document.getElementById('releasePaymentRef')?.value || '').trim();
            try {
                await db.releaseSettlement(_pendingReleaseId, ref || null);
                closeModal('releaseModal');
                showToast('F&F settlement marked as settled', 'success');
                loadSettlements();
            } catch (err) {
                showToast(err.message || 'Failed to mark settlement as settled', 'error');
            }
        }

        // ── NOTIFICATIONS ──
        async function renderNotifications() {
            try {
                const notifs = await db.getAdminNotifications();
                const body  = document.getElementById('notifDropdownBody');
                const badge = document.getElementById('notifBadge');
                if (!notifs || notifs.length === 0) { body.innerHTML = '<div class="notif-empty">No notifications</div>'; badge.style.display = 'none'; return; }
                const unread = notifs.filter(n => !n.read).length;
                badge.textContent = unread; badge.style.display = unread > 0 ? 'flex' : 'none';
                body.innerHTML = notifs.map(n => `<div class="notif-item ${!n.read ? 'unread' : ''}"><div style="flex:1;"><div class="notif-title">${escapeHtml(n.title)}</div><div class="notif-msg">${escapeHtml(n.message)}</div></div><button class="notif-dismiss" onclick="dismissNotif(event)">&#x2715;</button></div>`).join('');
            } catch (err) { console.error(err); }
        }

        // ── INIT ──
        window.addEventListener('DOMContentLoaded', async () => {
            _applyTheme(localStorage.getItem('bhr_theme') || 'dark');
            updateTopbarDate();
            await Promise.all([loadAdvances(), renderNotifications()]);
        });
    </script>
</body>
</html>
