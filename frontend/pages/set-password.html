<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeanHR — Set Password</title>
    <script>(function(){var t=localStorage.getItem('bhr_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- Firebase Compat SDK -->

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

            storageBucket:     "beanhr-portal.firebasestorage.app",

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent:        #77ca00;
            --accent-light:  #a0e040;
            --accent-glow:   rgba(119,202,0,0.35);
            --bg:            #07070f;
            --text:          #f1f1f5;
            --text-muted:    rgba(241,241,245,0.45);
            --text-faint:    rgba(241,241,245,0.2);
            --icon-faint:    rgba(241,241,245,0.28);
            --icon-muted:    rgba(241,241,245,0.65);
            --glass-bg:      rgba(255,255,255,0.04);
            --glass-border:  rgba(255,255,255,0.08);
            --input-bg:      rgba(255,255,255,0.05);
            --input-border:  rgba(255,255,255,0.09);
            --error-bg:      rgba(255,107,107,0.1);
            --error-border:  rgba(255,107,107,0.25);
            --error-text:    #ff9a9a;
            --success-bg:    rgba(119,202,0,0.08);
            --success-border:rgba(119,202,0,0.25);
            --success-text:  #a0e040;
            --warning:       #fbbf24;
            --danger:        #f87171;
        }

        [data-theme="light"] {
            --bg:            #f0f6e8;
            --accent:        #5a9900;
            --accent-light:  #77ca00;
            --accent-glow:   rgba(90,153,0,0.2);
            --text:          #1a2010;
            --text-muted:    rgba(26,32,16,0.58);
            --text-faint:    rgba(26,32,16,0.35);
            --icon-faint:    rgba(26,32,16,0.32);
            --icon-muted:    rgba(26,32,16,0.65);
            --glass-bg:      rgba(255,255,255,0.82);
            --glass-border:  rgba(26,32,16,0.1);
            --input-bg:      #ffffff;
            --input-border:  rgba(26,32,16,0.14);
            --error-bg:      rgba(200,50,50,0.07);
            --error-border:  rgba(200,50,50,0.2);
            --error-text:    #b91c1c;
            --success-bg:    rgba(90,153,0,0.07);
            --success-border:rgba(90,153,0,0.25);
            --success-text:  #3d6b00;
        }
        [data-theme="light"] .bg {
            background:
                radial-gradient(ellipse at 15% 55%, rgba(90,153,0,0.1) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 15%, rgba(168,106,62,0.07) 0%, transparent 50%),
                radial-gradient(ellipse at 65% 85%, rgba(90,153,0,0.07) 0%, transparent 50%),
                #f0f6e8;
        }
        [data-theme="light"] .orb   { opacity: 0.18; }
        [data-theme="light"] .orb-1 { background: radial-gradient(circle, rgba(90,153,0,0.22), transparent 70%); }
        [data-theme="light"] .orb-2 { background: radial-gradient(circle, rgba(168,106,62,0.12), transparent 70%); }
        [data-theme="light"] .card  {
            box-shadow: 0 0 0 1px rgba(0,0,0,0.05) inset, 0 20px 48px rgba(0,0,0,0.1), 0 0 40px rgba(90,153,0,0.05);
        }

        html { height: 100%; }
        body {
            min-height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-y: auto;
        }

        /* ── Animated Background ───────────────────────────── */
        .bg {
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse at 15% 55%, rgba(119,202,0,0.18) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 15%, rgba(160,224,64,0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 65% 85%, rgba(99,179,255,0.08) 0%, transparent 50%),
                var(--bg);
        }
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; animation: drift linear infinite; }
        .orb-1 { width:550px; height:550px; background:radial-gradient(circle, rgba(119,202,0,0.28), transparent 70%); top:-180px; left:-120px; animation-duration:22s; }
        .orb-2 { width:420px; height:420px; background:radial-gradient(circle, rgba(160,224,64,0.2), transparent 70%); bottom:-110px; right:-90px; animation-duration:28s; animation-direction:reverse; }
        .orb-3 { width:320px; height:320px; background:radial-gradient(circle, rgba(99,179,255,0.14), transparent 70%); top:38%; right:18%; animation-duration:34s; }

        @keyframes drift {
            0%   { transform: translate(0,0) scale(1); }
            33%  { transform: translate(28px,-28px) scale(1.06); }
            66%  { transform: translate(-18px,18px) scale(0.95); }
            100% { transform: translate(0,0) scale(1); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(28px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* ── Layout ────────────────────────────────────────── */
        .page {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; padding: 24px; gap: 28px;
        }

        /* ── Brand ─────────────────────────────────────────── */
        .brand { display: flex; align-items: center; gap: 13px; animation: fadeUp 0.4s cubic-bezier(0.22,1,0.36,1) forwards; }
        .brand-logo { width:58px; height:58px; background:linear-gradient(135deg, var(--accent), var(--accent-light)); border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; color:#fff; box-shadow:0 6px 28px var(--accent-glow); flex-shrink:0; letter-spacing:-1px; }
        .brand-name { font-size:26px; font-weight:700; color:var(--text); letter-spacing:-0.5px; line-height:1.2; }
        .brand-tag  { font-size:12px; color:var(--text-faint); text-transform:uppercase; letter-spacing:2px; margin-top:4px; }

        /* ── Glass Card ────────────────────────────────────── */
        .card {
            width: 100%; max-width: 428px;
            background: var(--glass-bg);
            backdrop-filter: blur(36px) saturate(180%);
            -webkit-backdrop-filter: blur(36px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 44px 44px 40px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.025) inset,
                0 40px 80px rgba(0,0,0,0.55),
                0 0 100px rgba(119,202,0,0.07);
            animation: fadeUp 0.55s cubic-bezier(0.22,1,0.36,1) forwards;
        }

        /* ── Icon Banner ───────────────────────────────────── */
        .icon-banner {
            width: 56px; height: 56px;
            background: rgba(119,202,0,0.1);
            border: 1px solid rgba(119,202,0,0.2);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px;
            color: var(--accent);
            font-size: 26px;
        }

        /* ── Heading ───────────────────────────────────────── */
        .heading    { font-size:24px; font-weight:700; letter-spacing:-0.5px; margin-bottom:6px; }
        .subheading { font-size:13.5px; color:var(--text-muted); margin-bottom:28px; line-height:1.55; }

        /* ── Form ──────────────────────────────────────────── */
        .form-group { margin-bottom: 20px; }
        label {
            display: block; font-size:11.5px; font-weight:600;
            color: var(--text-muted); text-transform:uppercase;
            letter-spacing:0.9px; margin-bottom:8px;
        }
        .input-wrap { position: relative; }
        .input-icon {
            position: absolute; left:15px; top:50%; transform:translateY(-50%);
            width:18px; height:18px; color:var(--icon-faint);
            pointer-events:none; display:flex; align-items:center; justify-content:center;
        }
        input[type="password"], input[type="text"] {
            width: 100%; background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 13px; padding: 14px 44px 14px 44px;
            font-size: 14px; font-family:'Inter',sans-serif;
            color: var(--text); outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: var(--text-faint); }
        input:focus {
            border-color: rgba(119,202,0,0.55);
            background: rgba(119,202,0,0.06);
            box-shadow: 0 0 0 3px rgba(119,202,0,0.13);
        }
        input.input-error { border-color: rgba(248,113,113,0.5) !important; box-shadow: 0 0 0 3px rgba(248,113,113,0.1) !important; }
        .pwd-toggle {
            position: absolute; right:13px; top:50%; transform:translateY(-50%);
            background:none; border:none; color:var(--icon-faint);
            cursor:pointer; padding:5px; display:flex; align-items:center;
            transition: color 0.2s;
        }
        .pwd-toggle:hover { color: var(--icon-muted); }

        /* ── Password Strength ─────────────────────────────── */
        .strength-bar {
            display: flex; gap: 4px; margin-top: 8px;
        }
        .strength-seg {
            flex: 1; height: 3px; border-radius: 3px;
            background: rgba(255,255,255,0.07);
            transition: background 0.25s ease;
        }
        [data-theme="light"] .strength-seg { background: rgba(0,0,0,0.08); }
        .strength-label {
            font-size: 11px; color: var(--text-faint);
            margin-top: 5px; min-height: 15px;
            transition: color 0.2s;
        }

        /* ── Requirements ──────────────────────────────────── */
        .req-list { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
        .req-item {
            display: flex; align-items: center; gap: 7px;
            font-size: 12px; color: var(--text-faint);
            transition: color 0.2s;
        }
        .req-item.met { color: var(--accent); }
        .req-icon { font-size: 13px; flex-shrink: 0; }

        /* ── Error / Success Banner ────────────────────────── */
        .banner {
            border-radius: 12px; padding: 12px 16px;
            font-size: 13px; margin-bottom: 20px;
            opacity: 0; visibility: hidden; max-height: 0; overflow: hidden;
            transition: opacity 0.3s, max-height 0.3s, visibility 0.3s, padding 0.3s, margin 0.3s;
        }
        .banner.show { opacity:1; visibility:visible; max-height:80px; }
        .banner.error   { background:var(--error-bg); border:1px solid var(--error-border); color:var(--error-text); }
        .banner.success { background:var(--success-bg); border:1px solid var(--success-border); color:var(--success-text); }

        /* ── Submit Button ─────────────────────────────────── */
        .btn-submit {
            width: 100%; padding: 15px; margin-top: 8px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border: none; border-radius: 13px;
            font-size: 15px; font-weight:600; font-family:'Inter',sans-serif;
            color: #fff; cursor: pointer;
            position: relative; overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 26px var(--accent-glow);
            letter-spacing: 0.3px;
        }
        .btn-submit::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg, rgba(255,255,255,0.15), transparent); opacity:0; transition:opacity 0.2s; }
        .btn-submit:hover { transform:translateY(-2px); box-shadow:0 10px 36px rgba(119,202,0,0.5); }
        .btn-submit:hover::before { opacity:1; }
        .btn-submit:active { transform:translateY(0); }
        .btn-submit:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }
        .btn-submit .spinner { display:none; width:17px; height:17px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.65s linear infinite; margin:0 auto; }
        .btn-submit.loading .btn-text { display:none; }
        .btn-submit.loading .spinner  { display:block; }

        /* ── Theme Toggle ──────────────────────────────────── */
        .theme-btn { position:fixed; top:18px; right:18px; z-index:100; width:38px; height:38px; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); transition:background 0.2s, box-shadow 0.2s; }
        .theme-btn:hover { background:rgba(119,202,0,0.12); box-shadow:0 0 0 2px rgba(119,202,0,0.25); }

        /* ── Card Footer ───────────────────────────────────── */
        .card-footer { margin-top:24px; text-align:center; font-size:11.5px; color:var(--text-faint); line-height:1.6; }
    </style>

        <!-- Custom Logo Background -->
    <style>
        .brand-logo, .brand-mark, .brand-toggle { 
            background: #ffffff !important; 
            box-shadow: 0 4px 15px rgba(255,255,255,0.12) !important; 
        }
        [data-theme="light"] .brand-logo, [data-theme="light"] .brand-mark, [data-theme="light"] .brand-toggle { 
            background: #111827 !important; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2) !important; 
        }
        
        /* Prevent the logo from having double-backgrounds in the sidebar */
        .brand-toggle .brand-logo {
            background: transparent !important;
            box-shadow: none !important;
            padding: 5px !important;
        }
    </style>
</head>
<body>

<div class="bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="page">

    <div class="brand">
        <div class="brand-logo" style="padding: 8px; box-sizing: border-box; "><img src="../assets/logo.svg" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;" /></div>
        <div>
            <div class="brand-name">Bean HR</div>
            <div class="brand-tag">Portal</div>
        </div>
    </div>

    <div class="card">

        <div class="icon-banner">
            <i class="ph-fill ph-lock-key"></i>
        </div>

        <h1 class="heading">Set your password</h1>
        <p class="subheading">Your account was created with a temporary password.<br>Please set a new password to continue.</p>

        <!-- Banner (error / success) -->
        <div class="banner error"   id="errorBanner"></div>
        <div class="banner success" id="successBanner"></div>

        <form id="setPasswordForm" onsubmit="handleSetPassword(event)" novalidate>

            <!-- New Password -->
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="input-wrap">
                    <span class="input-icon"><i class="ph ph-lock-simple" style="font-size:16px;display:flex"></i></span>
                    <input type="password" id="newPassword" placeholder="Create a strong password" autocomplete="new-password" oninput="onNewPasswordInput()" required />
                    <button type="button" class="pwd-toggle" onclick="togglePwd('newPassword','eyeNew')" aria-label="Toggle">
                        <i id="eyeNew" class="ph ph-eye" style="font-size:16px;display:flex"></i>
                    </button>
                </div>
                <!-- Strength bar -->
                <div class="strength-bar" id="strengthBar">
                    <div class="strength-seg" id="seg1"></div>
                    <div class="strength-seg" id="seg2"></div>
                    <div class="strength-seg" id="seg3"></div>
                    <div class="strength-seg" id="seg4"></div>
                </div>
                <div class="strength-label" id="strengthLabel"></div>
                <!-- Requirements checklist -->
                <div class="req-list" id="reqList">
                    <div class="req-item" id="req-length">
                        <i class="ph ph-circle req-icon" id="req-length-icon"></i>
                        <span>At least 8 characters</span>
                    </div>
                    <div class="req-item" id="req-upper">
                        <i class="ph ph-circle req-icon" id="req-upper-icon"></i>
                        <span>One uppercase letter</span>
                    </div>
                    <div class="req-item" id="req-number">
                        <i class="ph ph-circle req-icon" id="req-number-icon"></i>
                        <span>One number</span>
                    </div>
                    <div class="req-item" id="req-special">
                        <i class="ph ph-circle req-icon" id="req-special-icon"></i>
                        <span>One special character</span>
                    </div>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group" style="margin-bottom:0">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrap">
                    <span class="input-icon"><i class="ph ph-lock-simple" style="font-size:16px;display:flex"></i></span>
                    <input type="password" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required />
                    <button type="button" class="pwd-toggle" onclick="togglePwd('confirmPassword','eyeConfirm')" aria-label="Toggle">
                        <i id="eyeConfirm" class="ph ph-eye" style="font-size:16px;display:flex"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">Set Password &amp; Continue</span>
                <div class="spinner"></div>
            </button>

        </form>

        <div class="card-footer">
            Secured by Firebase Authentication &nbsp;·&nbsp; BeanHR © 2026
        </div>

    </div>
</div>

<button class="theme-btn" id="themeToggle" onclick="toggleTheme()">
    <i id="themeIcon" class="ph ph-sun" style="font-size:16px;display:flex"></i>
</button>

<script>
    // ── Detect which flow we're in ──────────────────────────────
    // Flow A — Email reset link: URL has ?mode=resetPassword&oobCode=XXX
    //           User is NOT logged in — arrived from Firebase password reset email.
    // Flow B — Force change: user just logged in, forcePasswordChange === true in Firestore.
    //           User IS logged in — sessionStorage has role + email.

    const _params  = new URLSearchParams(window.location.search);
    const _mode    = _params.get('mode');
    const _oobCode = _params.get('oobCode');
    const _isReset = _mode === 'resetPassword' && !!_oobCode;

    // ── Auth Guard (only for force-change flow) ─────────────────
    const _role  = sessionStorage.getItem('bhr_role');
    const _email = sessionStorage.getItem('bhr_email');
    if (!_isReset && (!_role || !_email)) {
        window.location.replace('./login.html');
    }

    // ── Role → Dashboard Map ────────────────────────────────────
    const ROLE_REDIRECT = {
        employee:    './employee/dashboard.html',
        manager:     './manager/dashboard.html',
        super_admin: './admin/dashboard.html',
        admin:       './admin/dashboard.html',
        finance:     './finance/dashboard.html',
        candidate:   './candidate/dashboard.html',
    };

    // ── Theme ───────────────────────────────────────────────────
    function _applyTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        const icon = document.getElementById('themeIcon');
        icon.className = (t === 'dark' ? 'ph ph-sun' : 'ph ph-moon') + ' ';
        icon.style.cssText = 'font-size:16px;display:flex';
    }
    _applyTheme(localStorage.getItem('bhr_theme') || 'dark');
    function toggleTheme() {
        const cur  = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = cur === 'dark' ? 'light' : 'dark';
        localStorage.setItem('bhr_theme', next);
        _applyTheme(next);
    }

    // ── Password Toggle ─────────────────────────────────────────
    function togglePwd(inputId, iconId) {
        const input  = document.getElementById(inputId);
        const hidden = input.type === 'password';
        input.type   = hidden ? 'text' : 'password';
        const icon   = document.getElementById(iconId);
        icon.className = (hidden ? 'ph ph-eye-slash' : 'ph ph-eye');
        icon.style.cssText = 'font-size:16px;display:flex';
    }

    // ── Password Strength ───────────────────────────────────────
    const STRENGTH_COLORS = ['#f87171', '#fbbf24', '#fbbf24', '#77ca00'];
    const STRENGTH_LABELS = ['Weak', 'Fair', 'Good', 'Strong'];

    function checkReqs(pwd) {
        return {
            length:  pwd.length >= 8,
            upper:   /[A-Z]/.test(pwd),
            number:  /[0-9]/.test(pwd),
            special: /[^A-Za-z0-9]/.test(pwd),
        };
    }

    function getScore(reqs) {
        return Object.values(reqs).filter(Boolean).length;
    }

    function onNewPasswordInput() {
        const pwd   = document.getElementById('newPassword').value;
        const reqs  = checkReqs(pwd);
        const score = getScore(reqs);

        // Update requirement items
        const map = { length: 'req-length', upper: 'req-upper', number: 'req-number', special: 'req-special' };
        Object.entries(map).forEach(([key, id]) => {
            const row  = document.getElementById(id);
            const icon = document.getElementById(id + '-icon');
            if (reqs[key]) {
                row.classList.add('met');
                icon.className = 'ph-fill ph-check-circle req-icon';
            } else {
                row.classList.remove('met');
                icon.className = 'ph ph-circle req-icon';
            }
        });

        // Update strength bar
        const segs  = ['seg1','seg2','seg3','seg4'];
        const color = pwd.length === 0 ? null : STRENGTH_COLORS[score - 1];
        segs.forEach((id, i) => {
            document.getElementById(id).style.background =
                (pwd.length > 0 && i < score) ? color : '';
        });

        // Update label
        const label = document.getElementById('strengthLabel');
        if (!pwd.length) {
            label.textContent = '';
            label.style.color = '';
        } else {
            label.textContent = STRENGTH_LABELS[score - 1];
            label.style.color = color;
        }
    }

    // ── Banner Helpers ──────────────────────────────────────────
    let _bannerTimer = null;
    function showBanner(type, msg, autohide = true) {
        ['error','success'].forEach(t => {
            const el = document.getElementById(t + 'Banner');
            el.classList.remove('show');
        });
        clearTimeout(_bannerTimer);
        const el = document.getElementById(type + 'Banner');
        el.textContent = msg;
        el.classList.add('show');
        if (autohide) _bannerTimer = setTimeout(() => el.classList.remove('show'), 5000);
    }
    function hideBanners() {
        clearTimeout(_bannerTimer);
        ['error','success'].forEach(t => document.getElementById(t + 'Banner').classList.remove('show'));
    }

    function getCurrentUser() {
        return new Promise((resolve) => {
            if (firebase.auth().currentUser) {
                resolve(firebase.auth().currentUser);
            } else {
                const unsubscribe = firebase.auth().onAuthStateChanged(user => {
                    unsubscribe();
                    resolve(user);
                });
            }
        });
    }

    // ── Submit ──────────────────────────────────────────────────
    async function handleSetPassword(e) {
        e.preventDefault();
        hideBanners();

        const newPwd     = document.getElementById('newPassword').value;
        const confirmPwd = document.getElementById('confirmPassword').value;
        const confirmEl  = document.getElementById('confirmPassword');

        // Validate requirements
        const reqs  = checkReqs(newPwd);
        const score = getScore(reqs);
        if (score < 4) {
            showBanner('error', 'Password does not meet all requirements.');
            document.getElementById('newPassword').focus();
            return;
        }

        // Validate match
        if (newPwd !== confirmPwd) {
            showBanner('error', 'Passwords do not match.');
            confirmEl.classList.add('input-error');
            confirmEl.focus();
            return;
        }
        confirmEl.classList.remove('input-error');

        // Set loading
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.classList.add('loading');

        try {
            if (_isReset) {
                // ── Flow A: Email reset link ──────────────────────────
                await firebase.auth().confirmPasswordReset(_oobCode, newPwd);
                showBanner('success', 'Password reset successfully! Redirecting to login…', false);
                setTimeout(() => window.location.replace('./login.html'), 1800);
            } else {
                // ── Flow B: Force change (already logged in) ──────────
                const user = await getCurrentUser();
                if (!user) {
                    showBanner('error', 'Authentication session not found. Please log in again.');
                    btn.disabled = false;
                    btn.classList.remove('loading');
                    return;
                }
                await user.updatePassword(newPwd);
                const uid = user.uid;
                await firebase.firestore().collection('accounts').doc(uid).update({ 
                    forcePasswordChange: false,
                    passwordResetRequired: false
                });
                showBanner('success', 'Password set successfully! Redirecting…', false);
                setTimeout(() => {
                    const dest = ROLE_REDIRECT[_role] || './login.html';
                    window.location.replace(dest);
                }, 1400);
            }

        } catch (err) {
            console.error('[SetPassword] error:', err);
            const msg = err.code === 'auth/requires-recent-login'
                ? 'Session expired. Please log in again.'
                : 'Failed to set password. Please try again.';
            showBanner('error', msg);
            btn.disabled = false;
            btn.classList.remove('loading');
        }
    }

    // ── Confirm field — clear error on re-type ──────────────────
    document.getElementById('confirmPassword').addEventListener('input', function() {
        this.classList.remove('input-error');
    });
</script>
