<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeanHR — Sign In</title>
    <script>(function(){var t=localStorage.getItem('bhr_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- Firebase Compat SDK (v9 compat — supports firebase.auth() / firebase.firestore() syntax) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script>
        firebase.initializeApp({
            apiKey:            "AIzaSyDdZHyY9_NDueeMRZE2K2XxOIM8gh2YcQk",
            authDomain:        "beanhr-portal.firebaseapp.com",
            projectId:         "beanhr-portal",
            storageBucket:     "beanhr-portal.firebasestorage.app",
            messagingSenderId: "1056336656581",
            appId:             "1:1056336656581:web:0887e592e541670163d8ac"
        });
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent:        #77ca00;
            --accent-light:  #a0e040;
            --accent-glow:   rgba(119,202,0,0.35);
            --brown:         #a86a3e;
            --brown-light:   #c8854a;
            --brown-glow:    rgba(168,106,62,0.25);
            --bg:            #07070f;
            --text:          #f1f1f5;
            --text-muted:    rgba(241,241,245,0.45);
            --text-faint:    rgba(241,241,245,0.2);
            --icon-faint:    rgba(241,241,245,0.28);
            --icon-muted:    rgba(241,241,245,0.65);
            --glass-bg:      rgba(255,255,255,0.04);
            --glass-border:  rgba(255,255,255,0.08);
            --input-bg:      rgba(255,255,255,0.05);
            --input-border:  rgba(255,255,255,0.09);
            --error-bg:      rgba(255,107,107,0.1);
            --error-border:  rgba(255,107,107,0.25);
            --error-text:    #ff9a9a;
        }

        /* ── Light Theme ───────────────────────────────────── */
        [data-theme="light"] {
            --bg:           #f0f6e8;
            --accent:       #5a9900;
            --accent-light: #77ca00;
            --accent-glow:  rgba(90,153,0,0.2);
            --text:         #1a2010;
            --text-muted:   rgba(26,32,16,0.58);
            --text-faint:   rgba(26,32,16,0.35);
            --icon-faint:   rgba(26,32,16,0.32);
            --icon-muted:   rgba(26,32,16,0.65);
            --glass-bg:     rgba(255,255,255,0.82);
            --glass-border: rgba(26,32,16,0.1);
            --input-bg:     #ffffff;
            --input-border: rgba(26,32,16,0.14);
            --error-bg:     rgba(200,50,50,0.07);
            --error-border: rgba(200,50,50,0.2);
            --error-text:   #b91c1c;
        }
        [data-theme="light"] .bg {
            background:
                radial-gradient(ellipse at 15% 55%, rgba(90,153,0,0.1) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 15%, rgba(168,106,62,0.07) 0%, transparent 50%),
                radial-gradient(ellipse at 65% 85%, rgba(90,153,0,0.07) 0%, transparent 50%),
                #f0f6e8;
        }
        [data-theme="light"] .orb   { opacity: 0.18; }
        [data-theme="light"] .orb-1 { background: radial-gradient(circle, rgba(90,153,0,0.22), transparent 70%); }
        [data-theme="light"] .orb-2 { background: radial-gradient(circle, rgba(168,106,62,0.12), transparent 70%); }
        [data-theme="light"] .card  {
            box-shadow: 0 0 0 1px rgba(0,0,0,0.05) inset, 0 20px 48px rgba(0,0,0,0.1), 0 0 40px rgba(90,153,0,0.05);
        }
        [data-theme="light"] .forgot { color: #4a7000; }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        /* ── Animated Background ───────────────────────────── */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 15% 55%, rgba(119,202,0,0.18) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 15%, rgba(160,224,64,0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 65% 85%, rgba(99,179,255,0.08) 0%, transparent 50%),
                var(--bg);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
            animation: drift linear infinite;
        }
        .orb-1 { width:550px; height:550px; background:radial-gradient(circle, rgba(119,202,0,0.28), transparent 70%); top:-180px; left:-120px; animation-duration:22s; }
        .orb-2 { width:420px; height:420px; background:radial-gradient(circle, rgba(160,224,64,0.2), transparent 70%); bottom:-110px; right:-90px; animation-duration:28s; animation-direction:reverse; }
        .orb-3 { width:320px; height:320px; background:radial-gradient(circle, rgba(99,179,255,0.14), transparent 70%); top:38%; right:18%; animation-duration:34s; }

        @keyframes drift {
            0%   { transform: translate(0,0) scale(1); }
            33%  { transform: translate(28px,-28px) scale(1.06); }
            66%  { transform: translate(-18px,18px) scale(0.95); }
            100% { transform: translate(0,0) scale(1); }
        }

        /* ── Layout ────────────────────────────────────────── */
        .page {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            gap: 28px;
        }

        /* ── Glass Card ────────────────────────────────────── */
        .card {
            width: 100%;
            max-width: 428px;
            background: var(--glass-bg);
            backdrop-filter: blur(36px) saturate(180%);
            -webkit-backdrop-filter: blur(36px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 48px 44px 40px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.025) inset,
                0 40px 80px rgba(0,0,0,0.55),
                0 0 100px rgba(119,202,0,0.07);
            animation: fadeUp 0.55s cubic-bezier(0.22,1,0.36,1) forwards;
        }

        @keyframes fadeUp {
            from { opacity:0; transform:translateY(28px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* ── Brand (outside card) ───────────────────────────── */
        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
            animation: fadeUp 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
        }
        .brand-logo {
            width: 58px; height: 58px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 800; color: #fff;
            box-shadow: 0 6px 28px var(--accent-glow);
            flex-shrink: 0;
            letter-spacing: -1px;
        }
        .brand-name  { font-size:26px; font-weight:700; color:var(--text); letter-spacing:-0.5px; line-height:1.2; }
        .brand-tag   { font-size:12px; color:var(--text-faint); text-transform:uppercase; letter-spacing:2px; margin-top:4px; }

        /* ── Heading ───────────────────────────────────────── */
        .heading    { font-size:27px; font-weight:700; letter-spacing:-0.6px; margin-bottom:8px; }
        .subheading { font-size:14px; color:var(--text-muted); margin-bottom:32px; line-height:1.5; }

        /* ── Form ──────────────────────────────────────────── */
        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 11.5px; font-weight:600;
            color: var(--text-muted);
            text-transform: uppercase; letter-spacing:0.9px;
            margin-bottom: 8px;
        }

        .input-wrap { position: relative; }

        .input-icon {
            position: absolute; left:15px; top:50%; transform:translateY(-50%);
            width:18px; height:18px;
            color: var(--icon-faint);
            pointer-events: none;
            display:flex; align-items:center; justify-content:center;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 13px;
            padding: 14px 16px 14px 44px;
            font-size: 14px; font-family:'Inter',sans-serif;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: var(--text-faint); }
        input:focus {
            border-color: rgba(119,202,0,0.55);
            background: rgba(119,202,0,0.06);
            box-shadow: 0 0 0 3px rgba(119,202,0,0.13);
        }

        .pwd-toggle {
            position: absolute; right:13px; top:50%; transform:translateY(-50%);
            background:none; border:none;
            color: var(--icon-faint);
            cursor:pointer; padding:5px;
            display:flex; align-items:center;
            transition: color 0.2s;
        }
        .pwd-toggle:hover { color: var(--icon-muted); }

        /* ── Forgot Link ───────────────────────────────────── */
        .forgot {
            display: block; text-align:right;
            font-size:12.5px; font-weight:500;
            color: rgba(119,202,0,0.85);
            text-decoration:none;
            margin-top:-12px; margin-bottom:28px;
            transition: color 0.2s;
        }
        .forgot:hover { color: var(--accent-light); }

        /* ── Error Banner ──────────────────────────────────── */
        .error-msg {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px; color: var(--error-text);
            margin-bottom: 20px;
            opacity: 0;
            visibility: hidden;
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.3s ease, max-height 0.3s ease, visibility 0.3s ease, padding 0.3s ease, margin 0.3s ease;
        }
        .error-msg.show {
            opacity: 1;
            visibility: visible;
            max-height: 80px;
        }

        @keyframes fadeIn {
            from { opacity:0; transform:translateY(-4px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* ── Submit Button ─────────────────────────────────── */
        .btn-login {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border: none; border-radius: 13px;
            font-size: 15px; font-weight:600; font-family:'Inter',sans-serif;
            color: #fff; cursor: pointer;
            position: relative; overflow:hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 26px var(--accent-glow);
            letter-spacing: 0.3px;
        }
        .btn-login::before {
            content:''; position:absolute; inset:0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity:0; transition:opacity 0.2s;
        }
        .btn-login:hover { transform:translateY(-2px); box-shadow:0 10px 36px rgba(119,202,0,0.5); }
        .btn-login:hover::before { opacity:1; }
        .btn-login:active { transform:translateY(0); box-shadow:0 4px 18px var(--accent-glow); }
        .btn-login:disabled { opacity:0.55; cursor:not-allowed; transform:none; }

        .btn-login .spinner {
            display:none; width:17px; height:17px;
            border:2px solid rgba(255,255,255,0.3); border-top-color:#fff;
            border-radius:50%;
            animation: spin 0.65s linear infinite;
            margin: 0 auto;
        }
        .btn-login.loading .btn-text { display:none; }
        .btn-login.loading .spinner  { display:block; }

        @keyframes spin { to { transform:rotate(360deg); } }

        /* ── Theme Toggle ──────────────────────────────────── */
        .theme-btn { position: fixed; top: 18px; right: 18px; z-index: 100; width: 38px; height: 38px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); transition: background 0.2s, box-shadow 0.2s, color 0.2s; }
        .theme-btn:hover { background: rgba(119,202,0,0.12); box-shadow: 0 0 0 2px rgba(119,202,0,0.25); }

        /* ── Footer ────────────────────────────────────────── */
        .card-footer {
            margin-top:28px; text-align:center;
            font-size:11.5px; color: var(--text-faint);
            line-height:1.6;
        }

        @media (max-width: 480px) {
            .page { padding: 16px; }
            .card { padding: 32px 24px 28px; }
        }
    </style>

        <!-- Custom Logo Background -->
    <style>
        .brand-logo, .brand-mark, .brand-toggle { 
            background: #ffffff !important; 
            box-shadow: 0 4px 15px rgba(255,255,255,0.12) !important; 
        }
        [data-theme="light"] .brand-logo, [data-theme="light"] .brand-mark, [data-theme="light"] .brand-toggle { 
            background: #111827 !important; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2) !important; 
        }
        
        /* Prevent the logo from having double-backgrounds in the sidebar */
        .brand-toggle .brand-logo {
            background: transparent !important;
            box-shadow: none !important;
            padding: 5px !important;
        }
    </style>
</head>
<body>

<!-- Background -->
<div class="bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<!-- Login Card -->
<div class="page">

    <!-- Brand (outside card) -->
    <div class="brand">
        <div class="brand-logo" style="padding: 8px; box-sizing: border-box; "><img src="../assets/logo.svg" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;" /></div>
        <div>
            <div class="brand-name">Bean HR</div>
            <div class="brand-tag">Portal</div>
        </div>
    </div>

    <div class="card">

        <h1 class="heading">Welcome back</h1>
        <p class="subheading">Sign in to your workspace</p>

        <!-- Error Banner -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" novalidate>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <span class="input-icon">
                        <i class="ph ph-envelope-simple" style="font-size:16px;display:flex"></i>
                    </span>
                    <input type="email" id="email" placeholder="you@company.com" autocomplete="email" required />
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <span class="input-icon">
                        <i class="ph ph-lock-simple" style="font-size:16px;display:flex"></i>
                    </span>
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required />
                    <button type="button" class="pwd-toggle" id="pwdToggle" onclick="togglePassword()" aria-label="Toggle password visibility">
                        <i id="eyeIconPh" class="ph ph-eye" style="font-size:16px;display:flex"></i>
                    </button>
                </div>
            </div>

            <a href="#" class="forgot" onclick="handleForgotPassword(event)">Forgot password?</a>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text">Sign In</span>
                <div class="spinner"></div>
            </button>

        </form>

        <div class="card-footer">
            Secured by Firebase Authentication &nbsp;·&nbsp; BeanHR © 2026
        </div>

    </div>
</div>

<button class="theme-btn" id="themeToggle" onclick="toggleTheme()"></button>

<script>
    // ─── Role → Dashboard Map ──────────────────────────────────
    const ROLE_REDIRECT = {
        employee:    '/employee/dashboard',
        manager:     '/manager/dashboard',
        super_admin: '/admin/dashboard',
        admin:       '/admin/dashboard',
        finance:     '/finance/dashboard',
        candidate:   '/candidate/dashboard',
    };

    // ─── Helpers ───────────────────────────────────────────────
    let errorTimer = null;
    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(errorTimer);
        errorTimer = setTimeout(() => el.classList.remove('show'), 5000);
    }
    function hideError() {
        clearTimeout(errorTimer);
        document.getElementById('errorMsg').classList.remove('show');
    }
    function setLoading(state) {
        const btn = document.getElementById('loginBtn');
        btn.disabled = state;
        btn.classList.toggle('loading', state);
    }

    // ─── Password Toggle ───────────────────────────────────────
    function togglePassword() {
        const input = document.getElementById('password');
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        const icon = document.getElementById('eyeIconPh');
        icon.className = isHidden ? 'ph ph-eye-slash' : 'ph ph-eye';
        icon.style.cssText = 'font-size:16px;display:flex';
    }

    // ─── Login Handler ─────────────────────────────────────────
    // Firebase wiring is stubbed below — uncomment each step once
    // Firebase is configured in firebase/firebase_config.js
    async function handleLogin(e) {
        e.preventDefault();
        hideError();

        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
            showError('Please enter your email address and password.');
            return;
        }

        setLoading(true);

        try {
            // ── STEP 1: Firebase Auth sign-in ──────────────────────────────────
            const result = await firebase.auth().signInWithEmailAndPassword(email, password);
            const uid = result.user.uid;

            // ── STEP 2: Read role + flags from Firestore ─────────────────────
            const snap = await firebase.firestore().collection('accounts').doc(uid).get();
            if (!snap.exists) throw new Error('Account not found. Contact your administrator.');
            const { role, status, forcePasswordChange, passwordResetRequired } = snap.data();
            if (status === 'suspended') throw new Error('Your account has been suspended. Contact admin.');
            sessionStorage.setItem('bhr_uid',   uid);
            sessionStorage.setItem('bhr_role',  role);
            sessionStorage.setItem('bhr_email', email.toLowerCase());

            // ── STEP 3: Redirect (forcePasswordChange / passwordResetRequired takes priority) ─────────
            if (forcePasswordChange || passwordResetRequired) { window.location.replace('./set-password.html'); return; }
            const dest = ROLE_REDIRECT[role];
            if (!dest) throw new Error('Unknown role. Contact your administrator.');
            window.location.href = dest;

        } catch (err) {
            const friendly = {
                'auth/user-not-found':              'Incorrect email or password.',
                'auth/wrong-password':              'Incorrect email or password.',
                'auth/invalid-login-credentials':   'Incorrect email or password.',
                'auth/invalid-credential':          'Incorrect email or password.',
                'auth/too-many-requests':           'Too many failed attempts. Please wait a few minutes and try again.',
                'auth/invalid-email':               'Please enter a valid email address.',
                'auth/user-disabled':               'This account has been disabled. Contact your administrator.',
                'auth/network-request-failed':      'Network error. Check your internet connection and try again.',
            };
            showError(friendly[err.code] || err.message || 'Login failed. Please try again.');
        } finally {
            setLoading(false);
        }
    }

    // ─── Forgot Password ───────────────────────────────────────
    function handleForgotPassword(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (!email) {
            showError('Enter your email address above first, then click Forgot Password.');
            return;
        }
        firebase.auth().sendPasswordResetEmail(email)
            .then(() => {
                const el = document.getElementById('errorMsg');
                el.textContent = 'Password reset email sent! Check your inbox.';
                el.style.color = '#a0e040';
                el.classList.add('show');
                clearTimeout(errorTimer);
                errorTimer = setTimeout(() => el.classList.remove('show'), 6000);
            })
            .catch(err => {
                const friendly = {
                    'auth/user-not-found': 'No account found with this email.',
                    'auth/invalid-email':  'Invalid email address.',
                };
                showError(friendly[err.code] || err.message);
            });
    }

    // ── Theme ─────────────────────────────────────────────────
    function _applyTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('bhr_theme', t);
        const btn = document.getElementById('themeToggle');
        if (!btn) return;
        const sunSVG  = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
        const moonSVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
        btn.innerHTML = t === 'dark' ? sunSVG : moonSVG;
        btn.title     = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    }
    function toggleTheme() {
        _applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }
    _applyTheme(localStorage.getItem('bhr_theme') || 'dark');
</script>

</body>
</html>
